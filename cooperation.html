<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فرم همکاری با تیوان</title>
    <style>
        body { font-family: Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f6f9; padding: 20px; text-align: right; }
        .form-container { max-width: 450px; background: #fff; margin: 30px auto; padding: 25px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #333; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #555; }
        input[type="text"], select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        .radio-group { display: flex; gap: 20px; margin-top: 5px; }
        button { width: 100%; padding: 12px; background-color: #28a745; color: white; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; transition: 0.3s; }
        button:hover { background-color: #218838; }
        .hidden { display: none; }
        .alert { padding: 10px; margin-top: 15px; border-radius: 5px; text-align: center; font-weight: bold; }
        .error { background-color: #f8d7da; color: #721c24; }
        .success { background-color: #d4edda; color: #155724; }
    </style>
</head>
<body>

<div class="form-container">
    <h2>فرم درخواست همکاری تیوان</h2>
    
    <div id="infoSection">
        <div class="form-group">
            <label>نام و نام خانوادگی:</label>
            <input type="text" id="fullName" placeholder="مثال: علی رضایی">
        </div>
        <div class="form-group">
            <label>شماره تماس:</label>
            <input type="text" id="phone" placeholder="مثال: 09123456789" style="text-align: left; direction: ltr;">
        </div>
        <div class="form-group">
            <label>جنسیت:</label>
            <div class="radio-group">
                <label><input type="radio" name="gender" value="آقا" checked> آقا</label>
                <label><input type="radio" name="gender" value="خانم"> خانم</label>
            </div>
        </div>
        <div class="form-group">
            <label>سال تولد (انتخاب کنید):</label>
            <select id="birthYear">
                </select>
        </div>
        <button onclick="sendOtp()">ارسال کد تایید</button>
    </div>

    <div id="otpSection" class="hidden">
        <div class="form-group">
            <label>کد تایید ۵ رقمی ارسال شده را وارد کنید:</label>
            <input type="text" id="otpCode" placeholder="* * * * *" style="text-align: center; letter-spacing: 5px;">
        </div>
        <button onclick="verifyOtp()" style="background-color: #007bff;">تایید نهایی و ثبت درخواست</button>
    </div>

    <div id="messageBox" class="alert hidden"></div>
</div>

<script>
    // آدرس ورکر آروان شما
    const arvanWorkerUrl = 'https://tivansms.tiva1shop-kh8xv.arvanedge.ir';
    
    // متغیرهای ذخیره موقت توکن امنیتی
    let sessionToken = '';
    let sessionExpires = '';

    // پر کردن خودکار باکس سال تولد (از ۱۳۵۰ تا ۱۴۰)
    const birthYearSelect = document.getElementById('birthYear');
    for (let year = 1400; year >= 1350; year--) {
        let option = document.createElement('option');
        option.value = year;
        option.textContent = year;
        birthYearSelect.appendChild(option);
    }

    function showMessage(text, isSuccess) {
        const box = document.getElementById('messageBox');
        box.textContent = text;
        box.className = `alert ${isSuccess ? 'success' : 'error'}`;
    }

    // مرحله ۱: ارسال اطلاعات و درخواست پیامک
    async function sendOtp() {
        const fullName = document.getElementById('fullName').value.trim();
        const phone = document.getElementById('phone').value.trim();
        const gender = document.querySelector('input[name="gender"]:checked').value;
        const birthYear = document.getElementById('birthYear').value;

        if (!fullName || !/^09\d{9}$/.test(phone)) {
            showMessage('لطفاً نام و شماره موبایل معتبر وارد کنید.', false);
            return;
        }

        try {
            // ارسال اطلاعات به ورکر با اکشن اختصاصی فرم همکاری
            const response = await fetch(`${arvanWorkerUrl}?action=send_cooperation&phone=${phone}`);
            const data = await response.json();

            if (data.success) {
                sessionToken = data.token;
                sessionExpires = data.expires;
                
                // پنهان کردن فرم اطلاعات و نمایش بخش کد تایید
                document.getElementById('infoSection').classList.add('hidden');
                document.getElementById('otpSection').classList.remove('hidden');
                showMessage('کد تایید با موفقیت ارسال شد.', true);
            } else {
                showMessage(data.message, false);
            }
        } catch (error) {
            showMessage('خطا در ارتباط با سرور. اینترنت خود را چک کنید.', false);
        }
    }

    // مرحله ۲: تایید کد و ارسال نهایی مشخصات به مدیر
    async function verifyOtp() {
        const phone = document.getElementById('phone').value.trim();
        const otp = document.getElementById('otpCode').value.trim();
        const fullName = document.getElementById('fullName').value.trim();
        const gender = document.querySelector('input[name="gender"]:checked').value;
        const birthYear = document.getElementById('birthYear').value;

        if (!otp) {
            showMessage('لطفاً کد تایید را وارد کنید.', false);
            return;
        }

        try {
            // ارسال کد همراه با اطلاعات فرم برای اس‌ام‌اس شدن به مدیر در صورت موفقیت
            const url = `${arvanWorkerUrl}?action=verify_cooperation&phone=${phone}&otp=${otp}&token=${sessionToken}&expires=${sessionExpires}&name=${encodeURIComponent(fullName)}&gender=${encodeURIComponent(gender)}&year=${birthYear}`;
            const response = await fetch(url);
            const data = await response.json();

            if (data.success) {
                document.getElementById('otpSection').classList.add('hidden');
                showMessage('درخواست همکاری شما با موفقیت ثبت شد و به مدیریت اطلاع داده شد. با تشکر!', true);
            } else {
                showMessage(data.message, false);
            }
        } catch (error) {
            showMessage('خطا در تایید کد. مجدداً تلاش کنید.', false);
        }
    }
</script>
</body>
</html>
