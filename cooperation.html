<style>
    /* استایل‌های اختصاصی فرم همکاری */
    .coop-title {
        font-size: 18px;
        font-weight: 700;
        color: #0f172a;
        margin-bottom: 6px;
        text-align: center;
    }
    .coop-subtitle {
        font-size: 12.5px;
        color: #64748b;
        margin-bottom: 16px;
        line-height: 1.6;
        text-align: right;
    }
    .coop-form-group {
        display: flex;
        flex-direction: column;
        gap: 10px;
        width: 100%;
    }
    .coop-input {
        width: 100%;
        padding: 11px 14px;
        border: 1.5px solid #e2e8f0;
        border-radius: 12px;
        font-family: inherit;
        font-size: 14px;
        text-align: right;
        letter-spacing: normal;
        color: #0f172a;
        outline: none;
        transition: all 0.2s ease;
        background: #f8fafc;
    }
    .coop-input:focus {
        border-color: #0f172a;
        background: #fff;
        box-shadow: 0 0 0 4px rgba(15, 23, 42, 0.05);
    }
    
    /* حل مشکل موقعیت ستاره و جهت تایپ شماره تلفن */
    .coop-input.phone-field {
        direction: rtl;
    }
    .coop-input.phone-field:not(:placeholder-shown) {
        direction: ltr;
        text-align: left;
    }

    select.coop-input {
        appearance: none;
        -webkit-appearance: none;
        -moz-appearance: none;
        background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2364748b'%3e%3cpath d='M7 10l5 5 5-5z'/%3e%3c/svg%3e");
        background-repeat: no-repeat;
        background-position: left 14px center;
        background-size: 18px;
        cursor: pointer;
    }

    /* استایل فیلدهای OTP */
    .coop-otp-container {
        display: flex;
        gap: 8px;
        justify-content: center;
        direction: ltr;
        margin-top: 5px;
    }
    .coop-otp-input {
        width: 45px;
        height: 45px;
        border: 1.5px solid #e2e8f0;
        border-radius: 10px;
        text-align: center;
        font-size: 18px;
        font-weight: bold;
        background: #f8fafc;
        outline: none;
        transition: all 0.2s;
    }
    .coop-otp-input:focus {
        border-color: #0f172a;
        background: #fff;
        box-shadow: 0 0 0 3px rgba(15, 23, 42, 0.05);
    }
</style>

<div class="coop-title">درخواست همکاری</div>
<div class="coop-subtitle" id="coopSubtitle">لطفا اطلاعات زیر را تکمیل کنید تا دراولین فرصت با شما تماس بگیریم</div>

<form id="coopForm" class="coop-form-group" novalidate>
    
    <input type="text" id="coopName" class="coop-input" placeholder="نام و نام خانوادگی *" required>
    <input type="text" id="coopPhone" class="coop-input phone-field" placeholder="تلفن همراه *" maxlength="11" inputmode="numeric" required>
    <input type="text" id="coopBirth" class="coop-input" placeholder="سال تولد *" maxlength="4" inputmode="numeric" required>
    
    <select id="coopJob" class="coop-input" required>
        <option value="کارشناس فروش" selected>کارشناس فروش</option>
        <option value="مدیرداخلی">مدیرداخلی</option>
        <option value="صندوقدار">صندوقدار</option>
        <option value="انباردار">انباردار</option>
    </select>
    
    <div id="coopOtpSection" style="display: none; margin-bottom: 5px;">
        <div class="coop-subtitle" style="text-align: center; margin-bottom: 10px; color: #0f172a;">کد تایید ۵ رقمی ارسال شده را وارد کنید:</div>
        <div class="coop-otp-container">
            <input type="text" id="coopOtp1" class="coop-otp-input" maxlength="1" inputmode="numeric">
            <input type="text" id="coopOtp2" class="coop-otp-input" maxlength="1" inputmode="numeric">
            <input type="text" id="coopOtp3" class="coop-otp-input" maxlength="1" inputmode="numeric">
            <input type="text" id="coopOtp4" class="coop-otp-input" maxlength="1" inputmode="numeric">
            <input type="text" id="coopOtp5" class="coop-otp-input" maxlength="1" inputmode="numeric">
        </div>
        <div id="coopTimerDisplay" style="text-align: center; font-size: 12px; color: #64748b; margin-top: 10px;"></div>
    </div>

    <div id="coopFeedback" class="form-feedback"></div>
    
    <button type="submit" id="coopSubmitBtn" class="club-submit-btn" style="padding: 12px; margin-top: 4px;">
        دریافت کد تایید
    </button>
</form>

<button class="close-modal-btn" id="closeCoopModalBtn" style="margin-top: 12px;">انصراف</button>

<script>
(function() {
    var coopCurrentStep = 1;
    var coopToken = '';
    var coopExpires = '';
    var coopVerifiedPhone = '';
    var arvanWorkerUrl = 'https://tivansms.tiva1shop-kh8xv.arvanedge.ir'; // آدرس ورکر شما
    var coopTimerInterval = null;

    var coopOtpInputs = [
        document.getElementById('coopOtp1'),
        document.getElementById('coopOtp2'),
        document.getElementById('coopOtp3'),
        document.getElementById('coopOtp4'),
        document.getElementById('coopOtp5')
    ];

    function toEnglishDigits(str) {
        var persianDigits = [/۰/g, /۱/g, /۲/g, /۳/g, /۴/g, /۵/g, /۶/g, /۷/g, /۸/g, /۹/g];
        var arabicDigits = [/٠/g, /١/g, /٢/g, /٣/g, /٤/g, /٥/g, /٦/g, /٧/g, /٨/g, /٩/g];
        for (var i = 0; i < 10; i++) {
            str = str.replace(persianDigits[i], i).replace(arabicDigits[i], i);
        }
        return str;
    }

    // فوکوس خودکار فیلدهای OTP فرم همکاری
    coopOtpInputs.forEach(function(input, index) {
        input.addEventListener('input', function(e) {
            var val = toEnglishDigits(e.target.value);
            e.target.value = val;
            if (val && index < coopOtpInputs.length - 1) {
                coopOtpInputs[index + 1].focus();
            }
            checkAndSubmitCoopOtp();
        });
        input.addEventListener('keydown', function(e) {
            if (e.key === 'Backspace' && this.value === '' && index > 0) {
                coopOtpInputs[index - 1].focus();
            }
        });
    });

    function checkAndSubmitCoopOtp() {
        var otp = '';
        coopOtpInputs.forEach(function(i) { otp += i.value; });
        if (otp.length === 5) {
            processCoopVerify(otp);
        }
    }

    function startCoopTimer() {
        var remains = 120;
        var display = document.getElementById('coopTimerDisplay');
        display.style.display = 'block';
        
        if(coopTimerInterval) clearInterval(coopTimerInterval);
        
        coopTimerInterval = setInterval(function() {
            remains--;
            var m = Math.floor(remains / 60);
            var s = remains % 60;
            display.innerText = 'زمان باقی مانده ' + m + ':' + (s < 10 ? '0' : '') + s + ' تا امکان درخواست مجدد';
            
            if (remains <= 0) {
                clearInterval(coopTimerInterval);
                display.style.display = 'none';
                document.getElementById('coopSubmitBtn').textContent = 'درخواست کد جدید';
                coopCurrentStep = 1;
                toggleInputs(false);
                document.getElementById('coopOtpSection').style.display = 'none';
            }
        }, 1000);
    }

    function toggleInputs(disabled) {
        document.getElementById('coopName').disabled = disabled;
        document.getElementById('coopPhone').disabled = disabled;
        document.getElementById('coopBirth').disabled = disabled;
        document.getElementById('coopJob').disabled = disabled;
    }

    document.getElementById('coopForm').addEventListener('submit', function(e) {
        e.preventDefault();
        if (coopCurrentStep === 1) {
            var name = document.getElementById('coopName').value.trim();
            var phone = toEnglishDigits(document.getElementById('coopPhone').value.trim());
            var birth = document.getElementById('coopBirth').value.trim();
            var job = document.getElementById('coopJob').value;
            var fb = document.getElementById('coopFeedback');
            var btn = document.getElementById('coopSubmitBtn');

            if (!name || !phone || !birth || !job) {
                fb.className = 'form-feedback error';
                fb.innerHTML = 'پرکردن همه فیلدها الزامی هست';
                return;
            }
            if (!/^09\d{9}$/.test(phone)) {
                fb.className = 'form-feedback error';
                fb.innerHTML = 'شماره همراه باید با 09 شروع شده و 11 رقم باشد';
                return;
            }

            fb.className = 'form-feedback loading';
            fb.innerHTML = 'در حال بررسی و ارسال کد... ⏳';
            btn.disabled = true;

            fetch(arvanWorkerUrl + '?phone=' + encodeURIComponent(phone) + '&action=coop-send', { method: 'GET', mode: 'cors' })
            .then(function(res) { return res.json(); })
            .then(function(data) {
                btn.disabled = false;
                if (data.success) {
                    coopToken = data.token;
                    coopExpires = data.expires;
                    coopVerifiedPhone = phone;
                    coopCurrentStep = 2;
                    toggleInputs(true);
                    document.getElementById('coopOtpSection').style.display = 'block';
                    coopOtpInputs.forEach(function(i) { i.value = ''; });
                    coopOtpInputs[0].focus();
                    btn.textContent = 'تایید نهایی کدتایید';
                    startCoopTimer();
                    fb.className = 'form-feedback success';
                    fb.innerHTML = 'کد تایید ۵ رقمی برای شما پیامک شد.';
                } else {
                    fb.className = 'form-feedback error';
                    fb.innerHTML = data.message || 'خطا در ارسال پیامک.';
                }
            })
            .catch(function() {
                btn.disabled = false;
                fb.className = 'form-feedback error';
                fb.innerHTML = 'خطا در ارتباط با سرور.';
            });

        } else if (coopCurrentStep === 2) {
            var otp = '';
            coopOtpInputs.forEach(function(i) { otp += i.value; });
            if (otp.length < 5) {
                document.getElementById('coopFeedback').className = 'form-feedback error';
                document.getElementById('coopFeedback').innerHTML = 'لطفاً کد تایید ۵ رقمی را کامل وارد کنید.';
                return;
            }
            processCoopVerify(otp);
        }
    });

    function processCoopVerify(otp) {
        var fb = document.getElementById('coopFeedback');
        var btn = document.getElementById('coopSubmitBtn');
        var name = document.getElementById('coopName').value.trim();
        var birth = document.getElementById('coopBirth').value.trim();
        var job = document.getElementById('coopJob').value;

        fb.className = 'form-feedback loading';
        fb.innerHTML = 'در حال تایید نهایی اطلاعات... ⏳';
        btn.disabled = true;

        var params = new URLSearchParams({
            phone: coopVerifiedPhone,
            action: 'coop-verify',
            otp: otp,
            token: coopToken,
            expires: coopExpires,
            name: name,
            birthYear: birth,
            jobTitle: job
        });

        fetch(arvanWorkerUrl + '?' + params.toString(), { method: 'GET', mode: 'cors' })
        .then(function(res) { return res.json(); })
        .then(function(data) {
            btn.disabled = false;
            if (data.success) {
                clearInterval(coopTimerInterval);
                document.getElementById('coopTimerDisplay').style.display = 'none';
                document.getElementById('coopOtpSection').style.display = 'none';
                fb.className = 'form-feedback success';
                fb.innerHTML = 'درخواست شما با موفقیت ثبت شد و به مدیر ارجاع گردید. ✨';
                document.getElementById('coopForm').reset();
                document.getElementById('coopJob').value = "کارشناس فروش";
                coopCurrentStep = 1;
                toggleInputs(false);
                btn.textContent = 'دریافت کد تایید';
            } else {
                fb.className = 'form-feedback error';
                fb.innerHTML = data.message || 'کد وارد شده صحیح نیست.';
            }
        })
        .catch(function() {
            btn.disabled = false;
            fb.className = 'form-feedback error';
            fb.innerHTML = 'خطا در تایید اطلاعات.';
        });
    }
})();
</script>
