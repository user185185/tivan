<div id="coopFormWrapperSecure" style="position: relative; min-height: 410px; direction: rtl; font-family: inherit; box-sizing: border-box;">

    <style>
        /* استایل‌های هماهنگ با هویت بصری تیوان */
        .coop-title-secure {
            font-size: 18px;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 6px;
            text-align: center;
        }
        .coop-subtitle-secure {
            font-size: 12.5px;
            color: #64748b;
            margin-bottom: 16px;
            line-height: 1.6;
            text-align: right;
        }
        .coop-form-group-secure {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
        }
        .coop-input-secure {
            width: 100%;
            padding: 11px 14px;
            border: 1.5px solid #e2e8f0;
            border-radius: 12px;
            font-family: inherit;
            font-size: 14px;
            text-align: right;
            color: #0f172a;
            outline: none;
            transition: all 0.2s ease;
            background: #f8fafc;
            box-sizing: border-box;
        }
        .coop-input-secure:focus {
            border-color: #0f172a;
            background: #fff;
            box-shadow: 0 0 0 4px rgba(15, 23, 42, 0.05);
        }
        .coop-input-secure.phone-field-secure {
            direction: ltr;
            text-align: left;
        }
        select.coop-input-secure {
            appearance: none;
            -webkit-appearance: none;
            -moz-appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2364748b'%3e%3cpath d='M7 10l5 5 5-5z'/%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: left 14px center;
            background-size: 18px;
            cursor: pointer;
            direction: rtl;
            text-align: right;
        }

        /* لایه شیشه‌ای که دقیقا روی همین فرم می‌آید و صفحات پشت آن پیداست */
        .coop-otp-overlay-secure {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(3px);
            -webkit-backdrop-filter: blur(3px);
            z-index: 99;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 15px;
            box-sizing: border-box;
            border-radius: 12px;
        }
        .coop-otp-container-secure {
            display: flex;
            gap: 8px;
            justify-content: center;
            direction: ltr;
            margin-top: 15px;
            margin-bottom: 15px;
        }
        .coop-otp-input-secure {
            width: 44px;
            height: 44px;
            border: 1.5px solid #e2e8f0;
            border-radius: 10px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            background: #fff;
            outline: none;
            transition: all 0.2s;
            color: #0f172a;
            box-sizing: border-box;
        }
        .coop-otp-input-secure:focus {
            border-color: #0f172a;
            box-shadow: 0 0 0 3px rgba(15, 23, 42, 0.05);
        }
    </style>

    <div id="coopMainFormView">
        <div class="coop-title-secure">درخواست همکاری</div>
        <div class="coop-subtitle-secure">لطفا اطلاعات زیر را تکمیل کنید تا در اولین فرصت با شما تماس بگیریم</div>

        <div class="coop-form-group-secure">
            <input type="text" id="coopNameSecure" class="coop-input-secure" placeholder="نام و نام خانوادگی *">
            <input type="text" id="coopPhoneSecure" class="coop-input-secure phone-field-secure" placeholder="09XXXXXXXXX" maxlength="11" inputmode="numeric">
            <input type="text" id="coopBirthSecure" class="coop-input-secure" placeholder="سال تولد (مثال: ۱۳۸۰) *" maxlength="4" inputmode="numeric">
            
            <select id="coopJobSecure" class="coop-input-secure">
                <option value="کارشناس فروش" selected>کارشناس فروش</option>
                <option value="مدیرداخلی">مدیرداخلی</option>
                <option value="صندوقدار">صندوقدار</option>
                <option value="انباردار">انباردار</option>
            </select>
            
            <div id="coopFeedbackSecure" class="form-feedback" style="text-align: center; font-size: 13px;"></div>
            
            <button type="button" id="coopSubmitBtnSecure" class="club-submit-btn" style="padding: 12px; width: 100%; cursor: pointer;">
                دریافت کد تایید
            </button>
        </div>
    </div>

    <div id="coopOtpOverlaySecure" class="coop-otp-overlay-secure" style="display: none;">
        <div class="coop-title-secure">تایید شماره همراه</div>
        <div id="coopOtpTargetPhone" class="coop-subtitle-secure" style="text-align: center; color: #0f172a; font-weight: bold; margin-bottom: 5px;"></div>
        <div class="coop-subtitle-secure" style="text-align: center; margin-bottom: 5px;">کد ۵ رقمی ارسال شده را وارد نمایید:</div>
        
        <div class="coop-otp-container-secure">
            <input type="text" id="coopOtpSecure1" class="coop-otp-input-secure" maxlength="1" inputmode="numeric">
            <input type="text" id="coopOtpSecure2" class="coop-otp-input-secure" maxlength="1" inputmode="numeric">
            <input type="text" id="coopOtpSecure3" class="coop-otp-input-secure" maxlength="1" inputmode="numeric">
            <input type="text" id="coopOtpSecure4" class="coop-otp-input-secure" maxlength="1" inputmode="numeric">
            <input type="text" id="coopOtpSecure5" class="coop-otp-input-secure" maxlength="1" inputmode="numeric">
        </div>

        <div id="coopTimerDisplaySecure" style="text-align: center; font-size: 13px; color: #64748b; margin-bottom: 12px; font-weight: 500;"></div>
        <div id="coopOtpFeedbackSecure" class="form-feedback" style="text-align: center; font-size: 13px; margin-bottom: 12px;"></div>

        <button type="button" id="coopResendBtnSecure" class="club-submit-btn" style="padding: 10px 20px; display: none; font-size: 13px; background-color: #475569; cursor: pointer;">
            ارسال مجدد رمز
        </button>
        
        <span id="coopBackToFormLink" style="font-size: 12px; color: #ef4444; text-decoration: underline; cursor: pointer; margin-top: 18px;">ویرایش اطلاعات / بازگشت</span>
    </div>

    <button class="close-modal-btn" id="closeCoopModalBtnSecure" style="margin-top: 16px; width: 100%; padding: 10px; cursor: pointer;">انصراف</button>
</div>

<script>
// تابع خوداجرا (IIFE) جهت فعال‌سازی آنی و مستقل از DOMContentLoaded
(function() {
    var openBtn = document.getElementById('openCoopBtn'); // در صورت وجود دکمه بازکننده در داکیومنت اصلی
    var coopOverlayWrapper = document.getElementById('coopFormWrapperSecure');
    var closeCoopBtn = document.getElementById('closeCoopModalBtnSecure');
    
    var submitPhoneBtn = document.getElementById('coopSubmitBtnSecure');
    var clientNameInput = document.getElementById('coopNameSecure');
    var clientPhoneInput = document.getElementById('coopPhoneSecure');
    var clientBirthInput = document.getElementById('coopBirthSecure');
    var clientJobSelect = document.getElementById('coopJobSecure');
    
    var otpOverlay = document.getElementById('coopOtpOverlaySecure');
    var formFeedback = document.getElementById('coopFeedbackSecure');
    var otpFeedback = document.getElementById('coopOtpFeedbackSecure');
    var timerDisplay = document.getElementById('coopTimerDisplaySecure');
    var resendBtn = document.getElementById('coopResendBtnSecure');
    var backToFormLink = document.getElementById('coopBackToFormLink');

    var otpInputs = [
        document.getElementById('coopOtpSecure1'),
        document.getElementById('coopOtpSecure2'),
        document.getElementById('coopOtpSecure3'),
        document.getElementById('coopOtpSecure4'),
        document.getElementById('coopOtpSecure5')
    ];

    var currentStep = 1; 
    var currentToken = '';
    var currentExpires = '';
    var verifiedPhone = '';
    var arvanWorkerUrl = 'https://tivansms.tiva1shop-kh8xv.arvanedge.ir';
    var timerInterval = null;
    var remainingSeconds = 0;
    var isVerifying = false;

    // تبدیل اعداد فارسی/عربی به انگلیسی
    function toEnglishDigits(str) {
        var persianDigits = [/۰/g, /۱/g, /۲/g, /۳/g, /۴/g, /۵/g, /۶/g, /۷/g, /۸/g, /۹/g];
        var arabicDigits = [/٠/g, /١/g, /٢/g, /٣/g, /٤/g, /٥/g, /٦/g, /٧/g, /٨/g, /٩/g];
        for (var i = 0; i < 10; i++) {
            str = str.replace(persianDigits[i], i).replace(arabicDigits[i], i);
        }
        return str;
    }

    // کنترل دقیق محرومیت‌های پله‌ای کاملاً مجزا از بخش کلاب (coop_)
    function checkBlockStatus() {
        var blockedUntil = localStorage.getItem('coop_blocked_until');
        if (blockedUntil) {
            var timeLeft = parseInt(blockedUntil) - Date.now();
            if (timeLeft > 0) {
                var minutesLeft = Math.ceil(timeLeft / (1000 * 60));
                var hoursLeft = Math.ceil(minutesLeft / 60);
                
                var msg = '';
                if (minutesLeft > 60) {
                    msg = '⚠️ شما به دلیل تلاش‌های ناموفق مکرر، تا ' + hoursLeft + ' ساعت آینده از ارسال درخواست محروم هستید.';
                } else {
                    msg = '⚠️ شما به دلیل تلاش‌های ناموفق مکرر، تا ' + minutesLeft + ' دقیقه آینده از ارسال درخواست محروم هستید.';
                }

                formFeedback.className = 'form-feedback error';
                formFeedback.innerText = msg;
                submitPhoneBtn.disabled = true;
                clientPhoneInput.disabled = true;
                otpOverlay.style.display = 'none';
                return true;
            } else {
                localStorage.removeItem('coop_blocked_until');
            }
        }
        return false;
    }

    // هندل رفت‌وآمد فوکوس بین ۵ مستطیل رمز
    otpInputs.forEach(function(input, index) {
        input.addEventListener('input', function(e) {
            var value = toEnglishDigits(e.target.value);
            e.target.value = value;

            if (!/^\d$/.test(value) && value !== '') {
                e.target.value = '';
                return;
            }
            if (value && index < otpInputs.length - 1) {
                otpInputs[index + 1].focus();
            }
            checkAndSubmitOTP();
        });

        input.addEventListener('keydown', function(e) {
            if (e.key === 'Backspace' && this.value === '' && index > 0) {
                otpInputs[index - 1].focus();
            }
        });
    });

    function checkAndSubmitOTP() {
        var otp = '';
        otpInputs.forEach(function(input) { otp += input.value; });
        if (otp.length === 5 && !isVerifying) {
            submitOTP(otp);
        }
    }

    // تایید رمز استخدام و ارسال مشخصات به مدیر
    function submitOTP(otp) {
        isVerifying = true;
        otpFeedback.className = 'form-feedback loading';
        otpFeedback.innerText = 'در حال بررسی صحت رمز... ⏳';

        var params = new URLSearchParams({
            phone: verifiedPhone,
            action: 'coop-verify',
            otp: otp,
            token: currentToken,
            expires: currentExpires,
            name: clientNameInput.value.trim(),
            birthYear: toEnglishDigits(clientBirthInput.value.trim()),
            jobTitle: clientJobSelect.value
        });

        fetch(arvanWorkerUrl + '?' + params.toString(), { method: 'GET', mode: 'cors' })
        .then(function(res) { return res.json(); })
        .then(function(data) {
            isVerifying = false;
            if (data.success === true) {
                clearInterval(timerInterval);
                otpFeedback.className = 'form-feedback success';
                otpFeedback.innerText = 'درخواست همکاری با موفقیت ثبت شد و به مدیر ارجاع گردید. ✨';
                timerDisplay.style.display = 'none';
                
                // ریست فیلدهای امنیت لوکال همکاری
                localStorage.removeItem('coop_attempts');
                localStorage.removeItem('coop_block_count');
                localStorage.removeItem('coop_blocked_until');

                setTimeout(function() { 
                    otpOverlay.style.display = 'none';
                    resetCoopForm();
                }, 3500);
            } else {
                otpFeedback.className = 'form-feedback error';
                otpFeedback.innerText = data.message || 'رمز وارد شده اشتباه است!';
            }
        })
        .catch(function() {
            isVerifying = false;
            otpFeedback.className = 'form-feedback error';
            otpFeedback.innerText = 'خطا در ارتباط با سرور. مجدداً تلاش کنید.';
        });
    }

    // آغاز تایمر معکوس دقیقاً ۲ دقیقه‌ای (۱۲۰ ثانیه)
    function startTimer() {
        remainingSeconds = 120; 
        timerDisplay.style.display = 'block';
        resendBtn.style.display = 'none';
        
        updateTimerDisplay();
        
        timerInterval = setInterval(function() {
            remainingSeconds--;
            updateTimerDisplay();
            
            if (remainingSeconds <= 0) {
                clearInterval(timerInterval);
                timerDisplay.style.display = 'none';
                resendBtn.style.display = 'block'; // هویدا شدن دکمه ارسال مجدد
            }
        }, 1000);
    }

    function updateTimerDisplay() {
        var minutes = Math.floor(remainingSeconds / 60);
        var seconds = remainingSeconds % 60;
        timerDisplay.innerText = 'زمان باقی مانده ' + minutes + ':' + (seconds < 10 ? '0' : '') + seconds + ' تا امکان درخواست مجدد';
    }

    // بازگردانی کل فرم به حالت پیش‌فرض
    function resetCoopForm() {
        currentStep = 1;
        currentToken = '';
        currentExpires = '';
        verifiedPhone = '';
        isVerifying = false;
        if (timerInterval) { clearInterval(timerInterval); }
        
        formFeedback.className = 'form-feedback';
        formFeedback.innerText = '';
        otpFeedback.className = 'form-feedback';
        otpFeedback.innerText = '';
        
        clientNameInput.value = '';
        clientPhoneInput.value = '';
        clientBirthInput.value = '';
        clientJobSelect.value = "کارشناس فروش";
        
        clientPhoneInput.disabled = false;
        clientNameInput.disabled = false;
        clientBirthInput.disabled = false;
        clientJobSelect.disabled = false;
        
        otpOverlay.style.display = 'none';
        otpInputs.forEach(function(i) { i.value = ''; });
        submitPhoneBtn.disabled = false;
        timerDisplay.style.display = 'none';
        resendBtn.style.display = 'none';
        
        checkBlockStatus();
    }

    // عملکرد دکمه اصلی دریافت کد تایید
    submitPhoneBtn.addEventListener('click', function() {
        if (checkBlockStatus()) return;

        var name = clientNameInput.value.trim();
        var phone = toEnglishDigits(clientPhoneInput.value.trim());
        var birth = toEnglishDigits(clientBirthInput.value.trim());

        if (!name || !phone || !birth) {
            formFeedback.className = 'form-feedback error';
            formFeedback.innerText = 'پرکردن تمامی فیلدهای ستاره‌دار الزامی است.';
            return;
        }
        if (!/^09\d{9}$/.test(phone)) {
            formFeedback.className = 'form-feedback error';
            formFeedback.innerText = 'لطفاً یک شماره موبایل معتبر ۱۱ رقمی وارد کنید.';
            return;
        }

        // بررسی و شمارش پله‌ای تلاش‌ها بر اساس لاجیک کلاب
        var attempts = parseInt(localStorage.getItem('coop_attempts') || '0');
        if (attempts >= 5) {
            var blockCount = parseInt(localStorage.getItem('coop_block_count') || '0') + 1;
            localStorage.setItem('coop_block_count', blockCount);
            
            var duration = 1 * 60 * 60 * 1000; // مرتبه اول: ۱ ساعت مسدودیت
            if (blockCount === 2) duration = 3 * 60 * 60 * 1000; // مرتبه دوم: ۳ ساعت مسدودیت
            if (blockCount >= 3) duration = 24 * 60 * 60 * 1000; // مرتبه سوم به بعد: ۲۴ ساعت مسدودیت
            
            localStorage.setItem('coop_blocked_until', Date.now() + duration);
            localStorage.setItem('coop_attempts', '0'); 
            checkBlockStatus();
            return;
        }

        formFeedback.className = 'form-feedback loading';
        formFeedback.innerText = 'در حال بررسی اطلاعات و ارسال کد... ⏳';
        submitPhoneBtn.disabled = true;

        fetch(arvanWorkerUrl + '?phone=' + encodeURIComponent(phone) + '&action=coop-send', {
            method: 'GET',
            mode: 'cors'
        })
        .then(function(res) { return res.json(); })
        .then(function(data) {
            submitPhoneBtn.disabled = false;
            if (data.success === true) {
                localStorage.setItem('coop_attempts', attempts + 1);

                currentToken = data.token;
                currentExpires = data.expires;
                verifiedPhone = phone;
                
                // قفل فیلدهای فرم مادر جهت حفظ امنیت داده‌ها
                clientPhoneInput.disabled = true;
                clientNameInput.disabled = true;
                clientBirthInput.disabled = true;
                clientJobSelect.disabled = true;
                
                // مقداردهی و گشودن پرده رمز (Overlay) روی فرم
                document.getElementById('coopOtpTargetPhone').innerText = phone;
                otpOverlay.style.display = 'flex';
                otpFeedback.className = 'form-feedback';
                otpFeedback.innerText = '';
                
                otpInputs.forEach(function(input) { input.value = ''; });
                startTimer();
                setTimeout(function() { otpInputs[0].focus(); }, 150);
            } else {
                formFeedback.className = 'form-feedback error';
                formFeedback.innerText = data.message || 'خطا در فرآیند ارسال پیامک.';
            }
        })
        .catch(function() {
            submitPhoneBtn.disabled = false;
            formFeedback.className = 'form-feedback error';
            formFeedback.innerText = 'خطا در ارتباط با سرور ورکر. اینترنت خود را بررسی کنید.';
        });
    });

    // عملکرد دکمه بازخوانی/ارسال مجدد کد پس از اتمام ۲ دقیقه
    resendBtn.addEventListener('click', function() {
        otpFeedback.className = 'form-feedback loading';
        otpFeedback.innerText = 'در حال ارسال مجدد رمز تایید... ⏳';
        resendBtn.style.display = 'none';

        fetch(arvanWorkerUrl + '?phone=' + encodeURIComponent(verifiedPhone) + '&action=coop-send', { method: 'GET', mode: 'cors' })
        .then(function(res) { return res.json(); })
        .then(function(data) {
            if (data.success === true) {
                currentToken = data.token;
                currentExpires = data.expires;
                otpFeedback.className = 'form-feedback success';
                otpFeedback.innerText = 'کد جدید با موفقیت پیامک شد.';
                startTimer();
            } else {
                otpFeedback.className = 'form-feedback error';
                otpFeedback.innerText = data.message || 'خطا در ارسال مجدد رمز.';
                resendBtn.style.display = 'block';
            }
        })
        .catch(function() {
            resendBtn.style.display = 'block';
            otpFeedback.className = 'form-feedback error';
            otpFeedback.innerText = 'خطا در شبکه.';
        });
    });

    // لینک بازگشت و اصلاح مشخصات
    backToFormLink.addEventListener('click', function() {
        if (timerInterval) clearInterval(timerInterval);
        otpOverlay.style.display = 'none';
        formFeedback.className = 'form-feedback';
        formFeedback.innerText = '';
        
        clientPhoneInput.disabled = false;
        clientNameInput.disabled = false;
        clientBirthInput.disabled = false;
        clientJobSelect.disabled = false;
    });

    // دکمه انصراف کلی مودال
    if(closeCoopBtn) {
        closeCoopBtn.addEventListener('click', function() {
            resetCoopForm();
        });
    }

    // اولین چِک در زمان لود اکتیو
    checkBlockStatus();
})();
</script>
