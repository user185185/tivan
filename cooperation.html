<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>درخواست همکاری - تیوان</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Vazirmatn', sans-serif;
            background: transparent; /* هماهنگی کامل با پس‌زمینه محو صفحه اصلی */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }
        .form-card {
            background: #ffffff;
            width: 100%;
            max-width: 390px;
            padding: 32px 24px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
            border: 1px solid #e2e8f0;
        }
        .form-header {
            text-align: center;
            margin-bottom: 24px;
        }
        .form-title {
            font-size: 19px;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 6px;
        }
        .form-subtitle {
            font-size: 13px;
            color: #64748b;
            line-height: 1.6;
        }
        .form-body {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .input-group {
            width: 100%;
        }
        .input-row {
            display: flex;
            gap: 12px;
            width: 100%;
        }
        /* فیلد تخصص بزرگ‌تر و فیلد سال تولد کوچک‌تر */
        .field-role {
            flex: 2.5;
        }
        .field-birth {
            flex: 1;
        }
        .form-control {
            width: 100%;
            padding: 14px 16px;
            border: 1.5px solid #e2e8f0;
            border-radius: 12px;
            font-family: inherit;
            font-size: 14px;
            color: #0f172a;
            outline: none;
            background: #f8fafc;
            transition: all 0.2s ease;
            text-align: right;
        }
        .form-control::placeholder {
            color: #94a3b8;
        }
        .form-control:focus {
            border-color: #0f172a;
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(15, 23, 42, 0.05);
        }
        .text-center {
            text-align: center;
        }
        textarea.form-control {
            resize: none;
            height: 90px;
            line-height: 1.6;
        }
        .submit-btn {
            width: 100%;
            padding: 14px;
            background: #0f172a;
            color: #ffffff;
            border: none;
            border-radius: 12px;
            font-family: inherit;
            font-size: 14.5px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 6px;
            box-shadow: 0 4px 12px rgba(15, 23, 42, 0.08);
        }
        .submit-btn:hover {
            background: #1e293b;
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(15, 23, 42, 0.12);
        }
        .submit-btn:active {
            transform: translateY(0);
        }
        .feedback {
            font-size: 13px;
            text-align: center;
            margin-top: 8px;
            font-weight: 500;
            min-height: 20px;
        }
        .feedback.success { color: #16a34a; }
        .feedback.error { color: #dc2626; }

        /* بهینه‌سازی دقیق برای نمایشگرهای کوچک موبایل */
        @media (max-width: 480px) {
            .form-card {
                padding: 24px 18px;
                border-radius: 16px;
            }
            .form-title { font-size: 17px; }
            .form-subtitle { font-size: 12px; }
            .form-control { padding: 12px 14px; font-size: 13.5px; }
            .submit-btn { padding: 12px; font-size: 14px; }
        }
    </style>
</head>
<body>

    <div class="form-card">
        <div class="form-header">
            <h1 class="form-title">فرم درخواست همکاری</h1>
            <p class="form-subtitle">لطفاً اطلاعات خود را وارد کنید تا در اسرع وقت با شما تماس بگیریم.</p>
        </div>

        <form id="cooperationForm" class="form-body">
            <div class="input-group">
                <input type="text" id="fullName" class="form-control" placeholder="نام و نام خانوادگی" required>
            </div>
            
            <div class="input-group">
                <input type="tel" id="phoneNumber" class="form-control text-center" placeholder="شماره تماس (۰۹XXXXXXXXX)" maxlength="11" inputmode="numeric" required>
            </div>
            
            <div class="input-row">
                <div class="input-group field-role">
                    <input type="text" id="jobRole" class="form-control" placeholder="زمینه همکاری (مثلاً فروشنده)" required>
                </div>
                <div class="input-group field-birth">
                    <input type="text" id="birthYear" class="form-control text-center" placeholder="سال تولد" maxlength="4" inputmode="numeric" required>
                </div>
            </div>
            
            <div class="input-group">
                <textarea id="resumeDetails" class="form-control" placeholder="سوابق کاری یا توضیحات کوتاه..."></textarea>
            </div>
            
            <button type="submit" class="submit-btn">ثبت درخواست همکاری</button>
            <div id="formFeedback" class="feedback"></div>
        </form>
    </div>

    <script>
        document.getElementById('cooperationForm').addEventListener('submit', function(e) {
            e.preventDefault();
            var feedback = document.getElementById('formFeedback');
            
            feedback.className = 'feedback success';
            feedback.innerHTML = 'درخواست شما با موفقیت ثبت شد. به‌زودی با شما تماس می‌گیریم.';
            
            // ارسال سیگنال به صفحه اصلی (index.html) برای بستن خودکار پاپ‌آپ بعد از ۲ ثانیه
            if (window.parent && window.parent.postMessage) {
                setTimeout(function() {
                    window.parent.postMessage('close_coop_modal', '*');
                }, 2000);
            }
        });
    </script>
</body>
</html>
