<style>
    /* استایل‌های اختصاصی فرم همکاری برای راست‌چین بودن و ارتفاع کم */
    .coop-title {
        font-size: 18px;
        font-weight: 700;
        color: #0f172a;
        margin-bottom: 16px;
    }
    .coop-form-group {
        display: flex;
        flex-direction: column;
        gap: 10px; /* فاصله کم بین فیلدها برای کاهش ارتفاع */
        width: 100%;
    }
    .coop-input {
        width: 100%;
        padding: 11px 14px; /* پدینگ بهینه برای جمع‌وجور شدن */
        border: 1.5px solid #e2e8f0;
        border-radius: 12px;
        font-family: inherit;
        font-size: 14px;
        text-align: right; /* راست‌چین برای فیلدهای متنی */
        letter-spacing: normal;
        color: #0f172a;
        outline: none;
        transition: all 0.2s ease;
        background: #f8fafc;
    }
    .coop-input:focus {
        border-color: #0f172a;
        background: #fff;
        box-shadow: 0 0 0 4px rgba(15, 23, 42, 0.05);
    }
    /* استایل خاص برای شماره همراه جهت نمایش بهتر اعداد */
    .coop-input.phone-field {
        direction: ltr;
        text-align: right;
    }
    /* سفارشی‌سازی فلش لیست کشویی */
    select.coop-input {
        appearance: none;
        -webkit-appearance: none;
        -moz-appearance: none;
        background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2364748b'%3e%3cpath d='M7 10l5 5 5-5z'/%3e%3c/svg%3e");
        background-repeat: no-repeat;
        background-position: left 14px center;
        background-size: 18px;
        cursor: pointer;
    }
</style>

<div class="coop-title">درخواست همکاری</div>

<form id="coopForm" class="coop-form-group">
    
    <!-- نام و نام خانوادگی -->
    <input type="text" class="coop-input" placeholder="نام و نام خانوادگی (الزامی)" required>
    
    <!-- تلفن همراه -->
    <input type="text" class="coop-input phone-field" placeholder="تلفن همراه (الزامی)" maxlength="11" inputmode="numeric" pattern="09[0-9]{9}" required>
    
    <!-- سال تولد -->
    <input type="text" class="coop-input" placeholder="سال تولد (الزامی)" maxlength="4" inputmode="numeric" required>
    
    <!-- زمینه همکاری -->
    <select class="coop-input" required>
        <option value="" disabled selected hidden>زمینه همکاری (الزامی)</option>
        <option value="مدیرداخلی">مدیرداخلی</option>
        <option value="صندوقدار">صندوقدار</option>
        <option value="کارشناس فروش">کارشناس فروش</option>
        <option value="انباردار">انباردار</option>
    </select>
    
    <!-- بخش فیدبک ثبت موفقیت‌آمیز -->
    <div id="coopFeedback" class="form-feedback"></div>
    
    <!-- دکمه ثبت نهایی -->
    <button type="submit" class="club-submit-btn" style="padding: 12px; margin-top: 4px;">ثبت درخواست</button>
</form>

<!-- دکمه انصراف و بستن پاپ‌آپ -->
<button class="close-modal-btn" id="closeCoopModalBtn" style="margin-top: 12px;">انصراف</button>
