<div class="modal-title">فرصت‌های همکاری</div>
<div class="modal-subtitle">جهت ارسال درخواست استخدام، فرم زیر را تکمیل نمایید.</div>

<div class="club-form-group">
    <div id="coopFieldsSection">
        <input type="text" id="coopName" class="club-input" placeholder="نام و نام خانوادگی" style="margin-bottom: 10px; text-align: right; letter-spacing: normal; font-size: 14px;">
        <input type="text" id="coopBirth" class="club-input" placeholder="سال تولد (مثال: ۱۳۸۰)" maxlength="4" inputmode="numeric" style="margin-bottom: 10px; font-size: 14px;">
        <input type="text" id="coopJob" class="club-input" placeholder="عنوان شغلی مدنظر (مثال: فروشنده)" style="margin-bottom: 10px; text-align: right; letter-spacing: normal; font-size: 14px;">
        <input type="text" id="coopPhone" class="club-input" placeholder="شماره همراه: ۰۹XXXXXXXXX" maxlength="11" inputmode="numeric" style="margin-bottom: 10px; font-size: 14px;">
    </div>

    <div id="coopOtpSection" style="display: none;">
        <div style="font-size: 12px; color: #64748b; margin-bottom: 4px;">کد تایید پیامک شده را وارد کنید:</div>
        <div class="otp-inputs-container">
            <input type="text" class="otp-input coop-otp-field" id="cOtp1" data-index="0" maxlength="1" inputmode="numeric" pattern="\d*">
            <input type="text" class="otp-input coop-otp-field" id="cOtp2" data-index="1" maxlength="1" inputmode="numeric" pattern="\d*">
            <input type="text" class="otp-input coop-otp-field" id="cOtp3" data-index="2" maxlength="1" inputmode="numeric" pattern="\d*">
            <input type="text" class="otp-input coop-otp-field" id="cOtp4" data-index="3" maxlength="1" inputmode="numeric" pattern="\d*">
            <input type="text" class="otp-input coop-otp-field" id="cOtp5" data-index="4" maxlength="1" inputmode="numeric" pattern="\d*">
        </div>
    </div>
    
    <button id="coopSubmitBtn" class="club-submit-btn">ارسال درخواست و دریافت کد</button>
    <div id="coopTimerDisplay" class="timer-badge" style="display: none;"></div>
    <div id="coopFeedback" class="form-feedback"></div>
</div>

<button class="close-modal-btn" id="closeCoopModalBtn">انصراف</button>
