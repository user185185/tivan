<div class="coop-master-container" style="position: relative; min-height: 400px; direction: rtl; font-family: inherit;">

    <style>
        .coop-title-secure {
            font-size: 18px;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 6px;
            text-align: center;
        }
        .coop-subtitle-secure {
            font-size: 12.5px;
            color: #64748b;
            margin-bottom: 16px;
            line-height: 1.6;
            text-align: right;
        }
        .coop-form-group-secure {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
        }
        .coop-input-secure {
            width: 100%;
            padding: 11px 14px;
            border: 1.5px solid #e2e8f0;
            border-radius: 12px;
            font-family: inherit;
            font-size: 14px;
            text-align: right;
            color: #0f172a;
            outline: none;
            transition: all 0.2s ease;
            background: #f8fafc;
            box-sizing: border-box;
        }
        .coop-input-secure:focus {
            border-color: #0f172a;
            background: #fff;
            box-shadow: 0 0 0 4px rgba(15, 23, 42, 0.05);
        }
        
        .coop-input-secure.phone-field-secure {
            direction: ltr;
            text-align: left;
        }

        select.coop-input-secure {
            appearance: none;
            -webkit-appearance: none;
            -moz-appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2364748b'%3e%3cpath d='M7 10l5 5 5-5z'/%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: left 14px center;
            background-size: 18px;
            cursor: pointer;
            direction: rtl;
            text-align: right;
        }

        /* لایه شیشه‌ای که روی فرم اصلی میاد ولی پشتش پیداست */
        .coop-otp-overlay-secure {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.94);
            backdrop-filter: blur(2px);
            -webkit-backdrop-filter: blur(2px);
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
            border-radius: 12px;
            transition: all 0.3s ease;
        }

        .coop-otp-container-secure {
            display: flex;
            gap: 8px;
            justify-content: center;
            direction: ltr;
            margin-top: 15px;
            margin-bottom: 15px;
        }
        .coop-otp-input-secure {
            width: 45px;
            height: 45px;
            border: 1.5px solid #e2e8f0;
            border-radius: 10px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            background: #fff;
            outline: none;
            transition: all 0.2s;
            color: #0f172a;
        }
        .coop-otp-input-secure:focus {
            border-color: #0f172a;
            box-shadow: 0 0 0 3px rgba(15, 23, 42, 0.05);
        }
    </style>

    <div class="coop-title-secure">درخواست همکاری</div>
    <div class="coop-subtitle-secure">لطفا اطلاعات زیر را تکمیل کنید تا در اولین فرصت با شما تماس بگیریم</div>

    <div class="coop-form-group-secure">
        <input type="text" id="coopNameSecure" class="coop-input-secure" placeholder="نام و نام خانوادگی *" required>
        <input type="text" id="coopPhoneSecure" class="coop-input-secure phone-field-secure" placeholder="09XXXXXXXXX" maxlength="11" inputmode="numeric" required>
        <input type="text" id="coopBirthSecure" class="coop-input-secure" placeholder="سال تولد (مثال: ۱۳۸۰) *" maxlength="4" inputmode="numeric" required>
        
        <select id="coopJobSecure" class="coop-input-secure" required>
            <option value="کارشناس فروش" selected>کارشناس فروش</option>
            <option value="مدیرداخلی">مدیرداخلی</option>
            <option value="صندوقدار">صندوقدار</option>
            <option value="انباردار">انباردار</option>
        </select>
        
        <div id="coopFeedbackSecure" class="form-feedback"></div>
        
        <button type="button" id="coopSubmitBtnSecure" class="club-submit-btn" style="padding: 12px; margin-top: 4px; width: 100%; cursor: pointer;" onclick="window.tivanCoopSendCode();">
            دریافت کد تایید
        </button>
    </div>

    <div id="coopOtpOverlaySecure" class="coop-otp-overlay-secure" style="display: none;">
        <div class="coop-title-secure">تایید شماره همراه</div>
        <div id="coopOtpTargetPhone" class="coop-subtitle-secure" style="text-align: center; color: #0f172a; font-weight: bold;"></div>
        <div class="coop-subtitle-secure" style="text-align: center; margin-bottom: 5px;">کد ۵ رقمی ارسال شده را وارد نمایید:</div>
        
        <div class="coop-otp-container-secure">
            <input type="text" id="coopOtpSecure1" class="coop-otp-input-secure" maxlength="1" inputmode="numeric" oninput="window.tivanCoopOtpInput(this, 1);" onkeydown="window.tivanCoopOtpKeydown(event, 1);">
            <input type="text" id="coopOtpSecure2" class="coop-otp-input-secure" maxlength="1" inputmode="numeric" oninput="window.tivanCoopOtpInput(this, 2);" onkeydown="window.tivanCoopOtpKeydown(event, 2);">
            <input type="text" id="coopOtpSecure3" class="coop-otp-input-secure" maxlength="1" inputmode="numeric" oninput="window.tivanCoopOtpInput(this, 3);" onkeydown="window.tivanCoopOtpKeydown(event, 3);">
            <input type="text" id="coopOtpSecure4" class="coop-otp-input-secure" maxlength="1" inputmode="numeric" oninput="window.tivanCoopOtpInput(this, 4);" onkeydown="window.tivanCoopOtpKeydown(event, 4);">
            <input type="text" id="coopOtpSecure5" class="coop-otp-input-secure" maxlength="1" inputmode="numeric" oninput="window.tivanCoopOtpInput(this, 5);" onkeydown="window.tivanCoopOtpKeydown(event, 5);">
        </div>

        <div id="coopTimerDisplaySecure" style="text-align: center; font-size: 13px; color: #64748b; margin-bottom: 12px; font-weight: 500;"></div>
        <div id="coopOtpFeedbackSecure" class="form-feedback" style="margin-bottom: 10px;"></div>

        <button type="button" id="coopResendBtnSecure" class="club-submit-btn" style="padding: 10px 20px; display: none; font-size: 13px; background-color: #475569; cursor: pointer;" onclick="window.tivanCoopResendCode();">
            ارسال مجدد رمز
        </button>
        
        <span style="font-size: 12px; color: #ef4444; text-decoration: underline; cursor: pointer; margin-top: 15px;" onclick="window.tivanCoopBackToForm();">ویرایش اطلاعات / بازگشت</span>
    </div>

    <button class="close-modal-btn" id="closeCoopModalBtnSecure" style="margin-top: 16px; width: 100%;">انصراف</button>
</div>

<script>
(function() {
    var coopTok = '';
    var coopExp = '';
    var coopVPhone = '';
    var arvanWorkerUrl = 'https://tivansms.tiva1shop-kh8xv.arvanedge.ir'; 
    var coopTimer = null;

    // تبدیل اعداد فارسی/عربی به انگلیسی
    function toEngDigits(str) {
        var p = [/۰/g, /۱/g, /۲/g, /۳/g, /۴/g, /۵/g, /۶/g, /۷/g, /۸/g, /۹/g];
        var a = [/٠/g, /١/g, /٢/g, /٣/g, /٤/g, /٥/g, /٦/g, /٧/g, /٨/g, /٩/g];
        for (var i = 0; i < 10; i++) {
            str = str.replace(p[i], i).replace(a[i], i);
        }
        return str;
    }

    // بررسی وضعیت بلاک بودن کاربر در بدو ورود یا درخواست
    function checkBlockStatus() {
        var blockedUntil = localStorage.getItem('tivan_coop_blocked_until');
        if (blockedUntil) {
            var timeLeft = parseInt(blockedUntil) - Date.now();
            if (timeLeft > 0) {
                var minutesLeft = Math.ceil(timeLeft / 60000);
                return "شما به دلیل تلاش‌های مکرر اشتباه، تا " + minutesLeft + " دقیقه دیگر مسدود هستید.";
            } else {
                localStorage.removeItem('tivan_coop_blocked_until');
                localStorage.setItem('tivan_coop_req_count', '0');
            }
        }
        return null;
    }

    // تابع ارسال کد تایید (مرحله اول)
    window.tivanCoopSendCode = function() {
        var isBlocked = checkBlockStatus();
        var fb = document.getElementById('coopFeedbackSecure');
        if (isBlocked) {
            fb.className = 'form-feedback error';
            fb.innerHTML = isBlocked;
            return;
        }

        var name = document.getElementById('coopNameSecure').value.trim();
        var phone = toEngDigits(document.getElementById('coopPhoneSecure').value.trim());
        var birth = document.getElementById('coopBirthSecure').value.trim();
        var job = document.getElementById('coopJobSecure').value;
        var btn = document.getElementById('coopSubmitBtnSecure');

        if (!name || !phone || !birth || !job) {
            fb.className = 'form-feedback error';
            fb.innerHTML = 'پرکردن همه فیلدهای ستاره‌دار الزامی است.';
            return;
        }
        if (!/^09\d{9}$/.test(phone)) {
            fb.className = 'form-feedback error';
            fb.innerHTML = 'شماره همراه باید با 09 شروع شده و 11 رقم باشد.';
            return;
        }

        // شمارش تعداد درخواست‌ها جهت امنیت بلاک ۱ ساعته
        var reqCount = parseInt(localStorage.getItem('tivan_coop_req_count') || '0');
        if (reqCount >= 5) {
            var blockTime = Date.now() + (60 * 60 * 1000); // ۱ ساعت قفل
            localStorage.setItem('tivan_coop_blocked_until', blockTime);
            fb.className = 'form-feedback error';
            fb.innerHTML = "بیش از ۵ بار کد درخواست کردید. حساب شما به مدت ۱ ساعت غیرفعال شد.";
            return;
        }

        fb.className = 'form-feedback loading';
        fb.innerHTML = 'در حال ارسال کد تایید... ⏳';
        btn.disabled = true;

        fetch(arvanWorkerUrl + '?phone=' + encodeURIComponent(phone) + '&action=coop-send', { method: 'GET', mode: 'cors' })
        .then(function(res) { return res.json(); })
        .then(function(data) {
            btn.disabled = false;
            if (data.success) {
                // ثبت لوکال ریکوئست افزایشی
                reqCount++;
                localStorage.setItem('tivan_coop_req_count', reqCount.toString());

                coopTok = data.token;
                coopExp = data.expires;
                coopVPhone = phone;

                // نمایش لایه رویی اختصاصی
                document.getElementById('coopOtpTargetPhone').innerText = phone;
                document.getElementById('coopOtpOverlaySecure').style.display = 'flex';
                document.getElementById('coopOtpFeedbackSecure').innerHTML = '';
                
                // ریست فیلدهای پسورد و فوکوس به فیلد اول
                for(var i=1; i<=5; i++) {
                    var inp = document.getElementById('coopOtpSecure' + i);
                    if(inp) inp.value = '';
                }
                setTimeout(function(){ 
                    if(document.getElementById('coopOtpSecure1')) document.getElementById('coopOtpSecure1').focus(); 
                }, 100);

                startSecTimer();
            } else {
                fb.className = 'form-feedback error';
                fb.innerHTML = data.message || 'خطا در ارسال پیامک.';
            }
        })
        .catch(function() {
            btn.disabled = false;
            fb.className = 'form-feedback error';
            fb.innerHTML = 'خطا در ارتباط با سرور ورکر.';
        });
    };

    // مدیریت فوکوس باکس‌های رمز متوالی
    window.tivanCoopOtpInput = function(element, index) {
        var val = toEngDigits(element.value);
        element.value = val;
        if (val && index < 5) {
            var nextInput = document.getElementById('coopOtpSecure' + (index + 1));
            if(nextInput) nextInput.focus();
        }
        
        // چک کردن اتوماتیک اتمام ۵ رقم رمز
        var otp = '';
        for(var i=1; i<=5; i++) {
            var inp = document.getElementById('coopOtpSecure' + i);
            if(inp) otp += inp.value;
        }
        if (otp.length === 5) {
            processSecVerify(otp);
        }
    };

    window.tivanCoopOtpKeydown = function(event, index) {
        if (event.key === 'Backspace' && document.getElementById('coopOtpSecure' + index).value === '' && index > 1) {
            var prevInput = document.getElementById('coopOtpSecure' + (index - 1));
            if(prevInput) prevInput.focus();
        }
    };

    // استارت معکوس تایمر ۲ دقیقه‌ای
    function startSecTimer() {
        var remains = 120; // ۲ دقیقه
        var display = document.getElementById('coopTimerDisplaySecure');
        var resendBtn = document.getElementById('coopResendBtnSecure');
        
        display.style.display = 'block';
        resendBtn.style.display = 'none';
        
        if(coopTimer) clearInterval(coopTimer);
        
        coopTimer = setInterval(function() {
            remains--;
            var m = Math.floor(remains / 60);
            var s = remains % 60;
            display.innerText = 'زمان باقی مانده: ' + m + ':' + (s < 10 ? '0' : '') + s;
            
            if (remains <= 0) {
                clearInterval(coopTimer);
                display.style.display = 'none';
                resendBtn.style.display = 'block'; // هویدا شدن دکمه ارسال مجدد
            }
        }, 1000);
    }

    // ارسال مجدد کد درون لایه اختصاصی
    window.tivanCoopResendCode = function() {
        document.getElementById('coopOtpFeedbackSecure').className = 'form-feedback loading';
        document.getElementById('coopOtpFeedbackSecure').innerHTML = 'در حال ارسال مجدد رمز... ⏳';
        
        var phone = coopVPhone;
        fetch(arvanWorkerUrl + '?phone=' + encodeURIComponent(phone) + '&action=coop-send', { method: 'GET', mode: 'cors' })
        .then(function(res) { return res.json(); })
        .then(function(data) {
            if (data.success) {
                coopTok = data.token;
                coopExp = data.expires;
                document.getElementById('coopOtpFeedbackSecure').className = 'form-feedback success';
                document.getElementById('coopOtpFeedbackSecure').innerHTML = 'کد جدید ارسال شد.';
                startSecTimer();
            } else {
                document.getElementById('coopOtpFeedbackSecure').className = 'form-feedback error';
                document.getElementById('coopOtpFeedbackSecure').innerHTML = data.message || 'خطا در ارسال مجدد.';
            }
        });
    };

    // لغو لایه و بازگشت به ادیت فرم
    window.tivanCoopBackToForm = function() {
        if(coopTimer) clearInterval(coopTimer);
        document.getElementById('coopOtpOverlaySecure').style.display = 'none';
        document.getElementById('coopFeedbackSecure').innerHTML = '';
    };

    // پردازش نهایی تایید رمز فرم همکاری
    function processSecVerify(otp) {
        var fb = document.getElementById('coopOtpFeedbackSecure');
        var name = document.getElementById('coopNameSecure').value.trim();
        var birth = document.getElementById('coopBirthSecure').value.trim();
        var job = document.getElementById('coopJobSecure').value;

        fb.className = 'form-feedback loading';
        fb.innerHTML = 'در حال بررسی صحت رمز... ⏳';

        var params = new URLSearchParams({
            phone: coopVPhone,
            action: 'coop-verify',
            otp: otp,
            token: coopTok,
            expires: coopExp,
            name: name,
            birthYear: birth,
            jobTitle: job
        });

        fetch(arvanWorkerUrl + '?' + params.toString(), { method: 'GET', mode: 'cors' })
        .then(function(res) { return res.json(); })
        .then(function(data) {
            if (data.success) {
                if(coopTimer) clearInterval(coopTimer);
                // صفر کردن شمارنده درخواست‌ها بعد از موفقیت کامل
                localStorage.setItem('tivan_coop_req_count', '0');
                
                fb.className = 'form-feedback success';
                fb.innerHTML = 'درخواست شما با موفقیت ثبت شد و به مدیر ارجاع گردید. ✨';
                
                setTimeout(function() {
                    document.getElementById('coopOtpOverlaySecure').style.display = 'none';
                    document.getElementById('coopNameSecure').value = '';
                    document.getElementById('coopPhoneSecure').value = '';
                    document.getElementById('coopBirthSecure').value = '';
                    document.getElementById('coopJobSecure').value = "کارشناس فروش";
                    document.getElementById('coopFeedbackSecure').innerHTML = '';
                }, 3000);
            } else {
                fb.className = 'form-feedback error';
                fb.innerHTML = data.message || 'رمز وارد شده اشتباه است!';
            }
        })
        .catch(function() {
            fb.className = 'form-feedback error';
            fb.innerHTML = 'خطا در تایید اطلاعات سرور.';
        });
    }
})();
</script>
