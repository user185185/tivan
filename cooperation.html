<style>
    /* استایل‌های اختصاصی فرم همکاری */
    .coop-title-secure {
        font-size: 18px;
        font-weight: 700;
        color: #0f172a;
        margin-bottom: 6px;
        text-align: center;
    }
    .coop-subtitle-secure {
        font-size: 12.5px;
        color: #64748b;
        margin-bottom: 16px;
        line-height: 1.6;
        text-align: right;
    }
    .coop-form-group-secure {
        display: flex;
        flex-direction: column;
        gap: 10px;
        width: 100%;
    }
    .coop-input-secure {
        width: 100%;
        padding: 11px 14px;
        border: 1.5px solid #e2e8f0;
        border-radius: 12px;
        font-family: inherit;
        font-size: 14px;
        text-align: right;
        letter-spacing: normal;
        color: #0f172a;
        outline: none;
        transition: all 0.2s ease;
        background: #f8fafc;
    }
    .coop-input-secure:focus {
        border-color: #0f172a;
        background: #fff;
        box-shadow: 0 0 0 4px rgba(15, 23, 42, 0.05);
    }
    
    .coop-input-secure.phone-field-secure {
        direction: rtl;
    }
    .coop-input-secure.phone-field-secure:not(:placeholder-shown) {
        direction: ltr;
        text-align: left;
    }

    select.coop-input-secure {
        appearance: none;
        -webkit-appearance: none;
        -moz-appearance: none;
        background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2364748b'%3e%3cpath d='M7 10l5 5 5-5z'/%3e%3c/svg%3e");
        background-repeat: no-repeat;
        background-position: left 14px center;
        background-size: 18px;
        cursor: pointer;
    }

    .coop-otp-container-secure {
        display: flex;
        gap: 8px;
        justify-content: center;
        direction: ltr;
        margin-top: 5px;
    }
    .coop-otp-input-secure {
        width: 45px;
        height: 45px;
        border: 1.5px solid #e2e8f0;
        border-radius: 10px;
        text-align: center;
        font-size: 18px;
        font-weight: bold;
        background: #f8fafc;
        outline: none;
        transition: all 0.2s;
    }
    .coop-otp-input-secure:focus {
        border-color: #0f172a;
        background: #fff;
        box-shadow: 0 0 0 3px rgba(15, 23, 42, 0.05);
    }
</style>

<div class="coop-title-secure">درخواست همکاری</div>
<div class="coop-subtitle-secure">لطفا اطلاعات زیر را تکمیل کنید تا دراولین فرصت با شما تماس بگیریم</div>

<form id="coopFormSecure" class="coop-form-group-secure" onsubmit="event.preventDefault();" novalidate>
    
    <input type="text" id="coopNameSecure" class="coop-input-secure" placeholder="نام و نام خانوادگی *" required>
    <input type="text" id="coopPhoneSecure" class="coop-input-secure phone-field-secure" placeholder="تلفن همراه *" maxlength="11" inputmode="numeric" required>
    <input type="text" id="coopBirthSecure" class="coop-input-secure" placeholder="سال تولد *" maxlength="4" inputmode="numeric" required>
    
    <select id="coopJobSecure" class="coop-input-secure" required>
        <option value="کارشناس فروش" selected>کارشناس فروش</option>
        <option value="مدیرداخلی">مدیرداخلی</option>
        <option value="صندوقدار">صندوقدار</option>
        <option value="انباردار">انباردار</option>
    </select>
    
    <div id="coopOtpSectionSecure" style="display: none; margin-bottom: 5px;">
        <div class="coop-subtitle-secure" style="text-align: center; margin-bottom: 10px; color: #0f172a;">کد تایید ۵ رقمی ارسال شده را وارد کنید:</div>
        <div class="coop-otp-container-secure">
            <input type="text" id="coopOtpSecure1" class="coop-otp-input-secure" maxlength="1" inputmode="numeric">
            <input type="text" id="coopOtpSecure2" class="coop-otp-input-secure" maxlength="1" inputmode="numeric">
            <input type="text" id="coopOtpSecure3" class="coop-otp-input-secure" maxlength="1" inputmode="numeric">
            <input type="text" id="coopOtpSecure4" class="coop-otp-input-secure" maxlength="1" inputmode="numeric">
            <input type="text" id="coopOtpSecure5" class="coop-otp-input-secure" maxlength="1" inputmode="numeric">
        </div>
        <div id="coopTimerDisplaySecure" style="text-align: center; font-size: 12px; color: #64748b; margin-top: 10px;"></div>
    </div>

    <div id="coopFeedbackSecure" class="form-feedback"></div>
    
    <button type="submit" id="coopSubmitBtnSecure" class="club-submit-btn" style="padding: 12px; margin-top: 4px;">
        دریافت کد تایید
    </button>
</form>

<button class="close-modal-btn" id="closeCoopModalBtnSecure" style="margin-top: 12px;">انصراف</button>

<script>
// اجرای مطمئن کدها پس از بارگذاری کامل DOM برای جلوگیری از کرش اسکریپت
document.addEventListener('DOMContentLoaded', function() {
    var coopStep = 1;
    var coopTok = '';
    var coopExp = '';
    var coopVPhone = '';
    var arvanWorkerUrl = 'https://tivansms.tiva1shop-kh8xv.arvanedge.ir'; 
    var coopTimer = null;

    var formEl = document.getElementById('coopFormSecure');
    if (!formEl) return; // لایه محافظتی

    var otpInputsSec = [
        document.getElementById('coopOtpSecure1'),
        document.getElementById('coopOtpSecure2'),
        document.getElementById('coopOtpSecure3'),
        document.getElementById('coopOtpSecure4'),
        document.getElementById('coopOtpSecure5')
    ];

    function toEngDigits(str) {
        var p = [/۰/g, /۱/g, /۲/g, /۳/g, /۴/g, /۵/g, /۶/g, /۷/g, /۸/g, /۹/g];
        var a = [/٠/g, /١/g, /٢/g, /٣/g, /٤/g, /٥/g, /٦/g, /٧/g, /٨/g, /٩/g];
        for (var i = 0; i < 10; i++) {
            str = str.replace(p[i], i).replace(a[i], i);
        }
        return str;
    }

    otpInputsSec.forEach(function(input, index) {
        if(!input) return;
        input.addEventListener('input', function(e) {
            var val = toEngDigits(e.target.value);
            e.target.value = val;
            if (val && index < otpInputsSec.length - 1) {
                otpInputsSec[index + 1].focus();
            }
            checkAndSubmitSecOtp();
        });
        input.addEventListener('keydown', function(e) {
            if (e.key === 'Backspace' && this.value === '' && index > 0) {
                otpInputsSec[index - 1].focus();
            }
        });
    });

    function checkAndSubmitSecOtp() {
        var otp = '';
        otpInputsSec.forEach(function(i) { if(i) otp += i.value; });
        if (otp.length === 5) {
            processSecVerify(otp);
        }
    }

    function startSecTimer() {
        var remains = 120;
        var display = document.getElementById('coopTimerDisplaySecure');
        if(!display) return;
        display.style.display = 'block';
        
        if(coopTimer) clearInterval(coopTimer);
        
        coopTimer = setInterval(function() {
            remains--;
            var m = Math.floor(remains / 60);
            var s = remains % 60;
            display.innerText = 'زمان باقی مانده ' + m + ':' + (s < 10 ? '0' : '') + s + ' تا امکان درخواست مجدد';
            
            if (remains <= 0) {
                clearInterval(coopTimer);
                display.style.display = 'none';
                document.getElementById('coopSubmitBtnSecure').textContent = 'درخواست کد جدید';
                coopStep = 1;
                toggleSecInputs(false);
                document.getElementById('coopOtpSectionSecure').style.display = 'none';
            }
        }, 1000);
    }

    function toggleSecInputs(disabled) {
        document.getElementById('coopNameSecure').disabled = disabled;
        document.getElementById('coopPhoneSecure').disabled = disabled;
        document.getElementById('coopBirthSecure').disabled = disabled;
        document.getElementById('coopJobSecure').disabled = disabled;
    }

    formEl.addEventListener('submit', function(e) {
        e.preventDefault();
        
        if (coopStep === 1) {
            var name = document.getElementById('coopNameSecure').value.trim();
            var phone = toEngDigits(document.getElementById('coopPhoneSecure').value.trim());
            var birth = document.getElementById('coopBirthSecure').value.trim();
            var job = document.getElementById('coopJobSecure').value;
            var fb = document.getElementById('coopFeedbackSecure');
            var btn = document.getElementById('coopSubmitBtnSecure');

            if (!name || !phone || !birth || !job) {
                fb.className = 'form-feedback error';
                fb.innerHTML = 'پرکردن همه فیلدها الزامی هست';
                return;
            }
            if (!/^09\d{9}$/.test(phone)) {
                fb.className = 'form-feedback error';
                fb.innerHTML = 'شماره همراه باید با 09 شروع شده و 11 رقم باشد';
                return;
            }

            fb.className = 'form-feedback loading';
            fb.innerHTML = 'در حال بررسی و ارسال کد... ⏳';
            btn.disabled = true;

            fetch(arvanWorkerUrl + '?phone=' + encodeURIComponent(phone) + '&action=coop-send', { method: 'GET', mode: 'cors' })
            .then(function(res) { return res.json(); })
            .then(function(data) {
                btn.disabled = false;
                if (data.success) {
                    coopTok = data.token;
                    coopExp = data.expires;
                    coopVPhone = phone;
                    coopStep = 2;
                    toggleSecInputs(true);
                    document.getElementById('coopOtpSectionSecure').style.display = 'block';
                    otpInputsSec.forEach(function(i) { if(i) i.value = ''; });
                    if(otpInputsSec[0]) otpInputsSec[0].focus();
                    btn.textContent = 'تایید نهایی کدتایید';
                    startSecTimer();
                    fb.className = 'form-feedback success';
                    fb.innerHTML = 'کد تایید ۵ رقمی برای شما پیامک شد.';
                } else {
                    fb.className = 'form-feedback error';
                    fb.innerHTML = data.message || 'خطا در ارسال پیامک.';
                }
            })
            .catch(function() {
                btn.disabled = false;
                fb.className = 'form-feedback error';
                fb.innerHTML = 'خطا در ارتباط با سرور ورکر.';
            });

        } else if (coopStep === 2) {
            var otp = '';
            otpInputsSec.forEach(function(i) { if(i) otp += i.value; });
            if (otp.length < 5) {
                document.getElementById('coopFeedbackSecure').className = 'form-feedback error';
                document.getElementById('coopFeedbackSecure').innerHTML = 'لطفاً کد تایید ۵ رقمی را کامل وارد کنید.';
                return;
            }
            processSecVerify(otp);
        }
    });

    function processSecVerify(otp) {
        var fb = document.getElementById('coopFeedbackSecure');
        var btn = document.getElementById('coopSubmitBtnSecure');
        var name = document.getElementById('coopNameSecure').value.trim();
        var birth = document.getElementById('coopBirthSecure').value.trim();
        var job = document.getElementById('coopJobSecure').value;

        fb.className = 'form-feedback loading';
        fb.innerHTML = 'در حال تایید نهایی اطلاعات... ⏳';
        btn.disabled = true;

        var params = new URLSearchParams({
            phone: coopVPhone,
            action: 'coop-verify',
            otp: otp,
            token: coopTok,
            expires: coopExp,
            name: name,
            birthYear: birth,
            jobTitle: job
        });

        fetch(arvanWorkerUrl + '?' + params.toString(), { method: 'GET', mode: 'cors' })
        .then(function(res) { return res.json(); })
        .then(function(data) {
            btn.disabled = false;
            if (data.success) {
                if(coopTimer) clearInterval(coopTimer);
                document.getElementById('coopTimerDisplaySecure').style.display = 'none';
                document.getElementById('coopOtpSectionSecure').style.display = 'none';
                fb.className = 'form-feedback success';
                fb.innerHTML = 'درخواست شما با موفقیت ثبت شد و به مدیر ارجاع گردید. ✨';
                formEl.reset();
                document.getElementById('coopJobSecure').value = "کارشناس فروش";
                coopStep = 1;
                toggleSecInputs(false);
                btn.textContent = 'دریافت کد تایید';
            } else {
                fb.className = 'form-feedback error';
                fb.innerHTML = data.message || 'کد وارد شده صحیح نیست.';
            }
        })
        .catch(function() {
            btn.disabled = false;
            fb.className = 'form-feedback error';
            fb.innerHTML = 'خطا در تایید اطلاعات.';
        });
    }
});
</script>
