<style>
    /* استایل‌های اختصاصی فرم همکاری */
    .coop-title {
        font-size: 18px;
        font-weight: 700;
        color: #0f172a;
        margin-bottom: 4px;
        text-align: right;
    }
    .coop-subtitle {
        font-size: 12.5px;
        color: #64748b;
        margin-bottom: 16px;
        line-height: 1.6;
        text-align: right;
    }
    .coop-form-group {
        display: flex;
        flex-direction: column;
        gap: 10px;
        width: 100%;
    }
    .coop-input {
        width: 100%;
        padding: 11px 14px;
        border: 1.5px solid #e2e8f0;
        border-radius: 12px;
        font-family: inherit;
        font-size: 14px;
        text-align: right;
        letter-spacing: normal;
        color: #0f172a;
        outline: none;
        transition: all 0.2s ease;
        background: #f8fafc;
    }
    .coop-input:focus {
        border-color: #0f172a;
        background: #fff;
        box-shadow: 0 0 0 4px rgba(15, 23, 42, 0.05);
    }
    
    /* حل مشکل موقعیت ستاره و جهت تایپ شماره تلفن */
    .coop-input.phone-field {
        direction: rtl; /* زمان خالی بودن راست‌چین است تا ستاره درست قرار بگیرد */
    }
    .coop-input.phone-field:not(:placeholder-shown) {
        direction: ltr; /* زمان تایپ چپ‌چین می‌شود تا شماره درست وارد شود */
        text-align: left;
    }

    select.coop-input {
        appearance: none;
        -webkit-appearance: none;
        -moz-appearance: none;
        background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2364748b'%3e%3cpath d='M7 10l5 5 5-5z'/%3e%3c/svg%3e");
        background-repeat: no-repeat;
        background-position: left 14px center;
        background-size: 18px;
        cursor: pointer;
    }
</style>

<div class="coop-title">درخواست همکاری</div>
<div class="coop-subtitle">لطفا اطلاعات زیر را تکمیل کنید دراولین فرصت با شما تماس خواهیم گرفت</div>

<form id="coopForm" class="coop-form-group" novalidate>
    
    <!-- نام و نام خانوادگی -->
    <input type="text" class="coop-input" placeholder="نام و نام خانوادگی *" required>
    
    <!-- تلفن همراه -->
    <input type="text" id="coopPhone" class="coop-input phone-field" placeholder="تلفن همراه *" maxlength="11" inputmode="numeric" required>
    
    <!-- سال تولد -->
    <input type="text" class="coop-input" placeholder="سال تولد *" maxlength="4" inputmode="numeric" required>
    
    <!-- زمینه همکاری -->
    <select class="coop-input" required>
        <option value="کارشناس فروش" selected>کارشناس فروش</option>
        <option value="مدیرداخلی">مدیرداخلی</option>
        <option value="صندوقدار">صندوقدار</option>
        <option value="انباردار">انباردار</option>
    </select>
    
    <!-- بخش فیدبک خطاها و موفقیت -->
    <div id="coopFeedback" class="form-feedback"></div>
    
    <!-- دکمه ثبت با منطق بررسی خالی بودن و فرمت شماره همراه -->
    <button type="submit" class="club-submit-btn" style="padding: 12px; margin-top: 4px;" 
            onclick="
                var form = this.form;
                var inputs = form.querySelectorAll('input[required], select[required]');
                var isEmpty = false;
                
                inputs.forEach(function(input) {
                    if(!input.value.trim()) { isEmpty = true; }
                });
                
                var fb = document.getElementById('coopFeedback');
                
                if(isEmpty) {
                    event.preventDefault();
                    fb.className = 'form-feedback error';
                    fb.innerHTML = 'پرکردن همه فیلدها الزامی هست';
                } else {
                    var phoneVal = document.getElementById('coopPhone').value.trim();
                    var phoneRegex = /^09\d{9}$/;
                    if(!phoneRegex.test(phoneVal)) {
                        event.preventDefault();
                        fb.className = 'form-feedback error';
                        fb.innerHTML = 'شماره همراه باید با ۰۹ شروع شده و ۱۱ رقم باشد';
                    }
                }
            ">
        ثبت درخواست
    </button>
</form>

<button class="close-modal-btn" id="closeCoopModalBtn" style="margin-top: 12px;">انصراف</button>
