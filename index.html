<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- این خط باعث می‌شود لوگو بالای تب مرورگر نمایش داده شود -->
    <link rel="icon" type="image/png" href="logo-title-red.png">
    
    <title>فروشگاه پوشاک تیوان</title>
    
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: #ffffff;
            font-family: 'Tahoma', sans-serif;
        }

        .logo-wrapper {
            width: 200px;
            height: auto;
            margin-bottom: 15px;
        }

        .logo-wrapper img {
            width: 100%;
            height: auto;
            display: block;
        }

        .store-title {
            font-size: 24px;
            color: #333;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="logo-wrapper">
        <img src="logo-title-red.png" alt="لوگوی فروشگاه پوشاک تیوان">
    </div>

    <div class="store-title">
        فروشگاه پوشاک تیوان
    </div>

</body>
</html>
