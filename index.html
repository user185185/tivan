<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- آیکون تب مرورگر -->
    <link rel="icon" type="image/png" href="logo-title-red.png">
    
    <title>فروشگاه پوشاک تیوان</title>
    
    <style>
        /* تعریف فونت (اگر فایل فونت را در پوشه پروژه داشته باشید) */
        @font-face {
            font-family: 'BNazanin';
            src: url('BNazanin.ttf') format('truetype'); /* فرض بر این است که فایل فونت کنار کد هست */
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            /* تغییر از justify-content: center به flex-start برای اینکه محتوا از بالا شروع شود */
            justify-content: flex-start; 
            min-height: 100vh;
            background-color: #ffffff; 
            /* اولویت با فونت Nazanin، سپس فونت‌های سیستم */
            font-family: 'BNazanin', 'B Nazanin', 'Tahoma', sans-serif;
            overflow-x: hidden;
        }

        /* کانتینر اصلی */
        .header-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 50px; /* فاصله از لبه بالای صفحه */
            opacity: 0; /* برای شروع انیمیشن */
            animation: fadeInHeader 1.5s ease-out 2.5s forwards; /* کمی تاخیر تا پایان انیمیشن لوگو */
        }

        /* استایل لوگو */
        .logo-wrapper {
            width: 150px; /* اندازه نهایی لوگو در بالا */
            height: auto;
            opacity: 0;
            animation: logoIntro 2.5s cubic-bezier(0.65, 0, 0.35, 1) forwards;
        }

        .logo-wrapper img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* استایل متن */
        .store-title {
            font-size: 32px; /* کمی بزرگتر برای زیبایی */
            color: #333;
            font-weight: bold;
            margin-top: 10px; /* فاصله دقیق زیر لوگو */
            opacity: 0;
            animation: titleAppear 1s ease-out 2.2s forwards;
        }

        /* --- انیمیشن‌ها --- */

        /* انیمیشن لوگو: از مرکز کوچک به سمت بالا بزرگ */
        @keyframes logoIntro {
            0% {
                opacity: 0;
                transform: scale(0.2) translateY(0);
            }
            50% {
                opacity: 1;
                transform: scale(1.2) translateY(0);
            }
            100% {
                opacity: 1;
                /* حرکت به سمت بالا (بسیار زیاد تا به بالای صفحه برسد) */
                transform: scale(1) translateY(-150px); 
            }
        }

        /* انیمیشن ظاهر شدن متن */
        @keyframes titleAppear {
            0% {
                opacity: 0;
                transform: translateY(10px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* انیمیشن نهایی برای ثابت کردن کل کانتینر در بالا */
        @keyframes fadeInHeader {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }

    </style>
</head>
<body>

    <!-- کانتینر اصلی که حالا نقش هدر را دارد -->
    <div class="header-container">
        <div class="logo-wrapper">
            <img src="logo-title-red.png" alt="لوگوی فروشگاه پوشاک تیوان">
        </div>

        <div class="store-title">
            فروشگاه پوشاک تیوان
        </div>
    </div>

</body>
</html>
