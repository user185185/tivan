<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <style>
        /* تنظیمات پایه صفحه */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: 'Tahoma', sans-serif;
            background-color: #ffffff;
            overflow-x: hidden;
        }

        /* لایه پترن پس‌زمینه */
        .background-pattern {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('logo-title-red.png');
            background-size: 150px; /* اندازه ریز لوگو در پترن */
            opacity: 0.05; /* بسیار کم برای جلوه حرفه‌ای */
            z-index: -1;
            pointer-events: none;
        }

        /* کانتینر اصلی */
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            gap: 20px;
        }

        /* انیمیشن لوگو */
        .logo {
            width: 200px;
            transition: all 0.8s cubic-bezier(0.25, 0.8, 0.25, 1);
            will-change: transform;
        }

        /* وضعیت اولیه لوگو (مرکز) */
        .logo.centered {
            transform: translateY(0) scale(1);
        }

        /* وضعیت نهایی لوگو (بالا) */
        .logo.moved-up {
            transform: translateY(-150px) scale(0.6);
        }

        .title {
            font-size: 24px;
            color: #333;
            opacity: 0;
            transition: opacity 1s ease-in;
        }

        .visible {
            opacity: 1;
        }
    </style>
</head>
<body>

    <div class="background-pattern"></div>

    <div class="container">
        <img src="logo-title-red.png" alt="Logo" class="logo centered" id="mainLogo">
        <h1 class="title" id="mainTitle">به فروشگاه تیوان خوش آمدید</h1>
    </div>

    <script>
        // اجرای انیمیشن بعد از بارگذاری کامل صفحه
        window.onload = () => {
            setTimeout(() => {
                document.getElementById('mainLogo').classList.add('moved-up');
                document.getElementById('mainTitle').classList.add('visible');
            }, 500);
        };
    </script>
</body>
</html>
