<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فروشگاه تیوان</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: #ffffff;
            font-family: 'Vazirmatn', sans-serif;
        }

        .main-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            padding: 20px;
            box-sizing: border-box;
        }

        .logo-wrapper {
            width: 120px;
            animation: introAnimation 2s cubic-bezier(0.65, 0, 0.35, 1) forwards;
        }
        .logo-wrapper img { width: 100%; display: block; }

        .info-container {
            text-align: center;
            max-width: 450px;
            width: 100%;
            opacity: 0;
            animation: fadeIn 1s ease forwards 1.5s;
        }

        .info-item { font-size: 15px; color: #444; margin-bottom: 12px; }

        /* اصلاح اصلی در اینجا: inline-flex برای حفظ جریان متنی */
        .phone-link, .instagram-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-decoration: none;
            color: #444;
            margin: 5px 0;
            padding: 5px 10px;
            transition: 0.3s;
        }

        .phone-svg { width: 20px; height: 20px; fill: #25D366; }
        .instagram-icon { width: 20px; height: 20px; }

        .button-group {
            margin-top: 25px;
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 8px 22px;
            border: 1.5px solid #333;
            background: transparent;
            cursor: pointer;
            font-family: 'Vazirmatn', sans-serif;
            border-radius: 5px;
            transition: 0.3s;
        }
        .btn:hover { background: #333; color: #fff; }

        @keyframes introAnimation {
            0% { transform: scale(0.3); }
            100% { transform: scale(1) translateY(0); } /* ساده‌تر و ایمن‌تر از مقادیر منفی */
        }

        @keyframes fadeIn { to { opacity: 1; } }
    </style>
</head>
<body>

    <div class="main-container">
        <div class="logo-wrapper">
            <img src="logo-title-red.png" alt="لوگوی فروشگاه تیوان">
        </div>

        <div class="info-container">
            <div class="info-item">آدرس فروشگاه: اصفهان - خیابان نظرغربی - سه راه نظر - جنب بانک ملی</div>
            
            <div>
                <a href="tel:03136264237" class="phone-link">
                    <svg class="phone-svg" viewBox="0 0 24 24"><path d="M6.62,10.79C8.06,13.62 10.38,15.94 13.21,17.38L15.41,15.18C15.69,14.9 16.08,14.82 16.43,14.93C17.55,15.3 18.75,15.5 20,15.5A1,1 0 0,1 21,16.5V20A1,1 0 0,1 20,21A17,17 0 0,1 3,4A1,1 0 0,1 4,3H7.5A1,1 0 0,1 8.5,4C8.5,5.25 8.7,6.45 9.07,7.57C9.18,7.92 9.1,8.31 8.82,8.59L6.62,10.79Z"/></svg>
                    <span>03136264237</span>
                </a>
            </div>

            <div>
                <a href="https://instagram.com/tivan.shop" target="_blank" class="instagram-link">
                    <img class="instagram-icon" src="https://upload.wikimedia.org/wikipedia/commons/a/a5/Instagram_icon.png" alt="Instagram">
                    <span>instagram.com/tivan.shop</span>
                </a>
            </div>
            
            <div class="button-group">
                <button class="btn">فرم همکاری</button>
                <button class="btn">گالری عکس‌ها</button>
            </div>
        </div>
    </div>

</body>
</html>
