<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="icon" type="image/png" href="logo-title-red.png">
    <title>فروشگاه پوشاک تیوان</title>
    
    <style>
        @font-face {
            font-family: 'BNazanin';
            src: url('BNazanin.ttf') format('truetype');
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            /* اینجا محتوا را از بالا شروع می‌کنیم */
            justify-content: flex-start; 
            min-height: 100vh;
            background-color: #ffffff; 
            font-family: 'BNazanin', 'B Nazanin', 'Tahoma', sans-serif;
            overflow-x: hidden;
        }

        /* کانتینر اصلی که در بالای صفحه ثابت می‌ماند */
        .header-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 40px; /* فاصله از سقف صفحه */
            width: 100%;
            opacity: 0;
            animation: fadeInHeader 1s ease-out 2.5s forwards;
        }

        /* لوگو */
        .logo-wrapper {
            width: 140px; 
            height: auto;
            opacity: 0;
            /* انیمیشن فقط برای ظاهر شدن و بزرگ شدن */
            animation: logoIntro 2.5s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        .logo-wrapper img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* متن زیر لوگو */
        .store-title {
            font-size: 28px;
            color: #333;
            font-weight: bold;
            margin-top: 10px;
            opacity: 0;
            animation: titleAppear 1s ease-out 2.2s forwards;
        }

        /* --- انیمیشن‌های اصلاح شده --- */

        /* انیمیشن لوگو: از حالت بسیار کوچک و شفاف، به اندازه اصلی و شفاف می‌رسد */
        @keyframes logoIntro {
            0% {
                opacity: 0;
                transform: scale(0.3);
            }
            50% {
                opacity: 0.5;
                transform: scale(1.1);
            }
            100% {
                opacity: 1;
                transform: scale(1); /* در نهایت در اندازه اصلی خودش در جای خودش می‌ماند */
            }
        }

        /* انیمیشن متن */
        @keyframes titleAppear {
            0% {
                opacity: 0;
                transform: translateY(10px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* انیمیشن ظاهر شدن کل بخش هدر */
        @keyframes fadeInHeader {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }

    </style>
</head>
<body>

    <!-- حالا این کانتینر از همان ابتدا در بالای صفحه است و فقط محتویاتش انیمیشن دارند -->
    <div class="header-container">
        <div class="logo-wrapper">
            <img src="logo-title-red.png" alt="لوگوی فروشگاه پوشاک تیوان">
        </div>

        <div class="store-title">
            فروشگاه پوشاک تیوان
        </div>
    </div>

</body>
</html>
