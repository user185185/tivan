<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فروشگاه تیوان</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: 'Vazirmatn', sans-serif;
            background: #fff;
            overflow: hidden;
        }

        .page {
            position: relative;
            width: 100%;
            height: 100vh;
        }

        /* لایه مستقل لوگو */
        .logo-layer {
            position: fixed;
            top: 50%;
            left: 50%;
            z-index: 20;
            width: 170px;
            pointer-events: none;
            transform: translate(-50%, -50%);
            will-change: transform, opacity;
            opacity: 0;
            animation: logoIntro 3.4s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        .logo-layer img {
            display: block;
            width: 100%;
            height: auto;
        }

        .content {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            padding-top: 310px;
            opacity: 0;
            transform: translateY(24px);
            animation: contentEnter 1s ease-out forwards 2.95s;
        }

        .main-container {
            width: 100%;
            max-width: 520px;
            text-align: center;
            padding: 0 20px;
        }

        .info-item {
            font-size: 16px;
            color: #333;
            margin-bottom: 18px;
            line-height: 1.9;
        }

        .phone-link,
        .instagram-link {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: #333;
            margin: 8px 0;
            padding: 8px 12px;
            direction: ltr;
            unicode-bidi: isolate;
            white-space: nowrap;
            font-size: 15px;
        }

        .phone-link:hover,
        .instagram-link:hover {
            color: #000;
        }

        .button-group {
            margin-top: 30px;
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 10px 24px;
            border: 2px solid #333;
            background: transparent;
            cursor: pointer;
            font-family: 'Vazirmatn', sans-serif;
            border-radius: 10px;
            transition: 0.3s ease;
        }

        .btn:hover {
            background: #333;
            color: #fff;
        }

        /* انیمیشن نرم و ملایم لوگو */
        @keyframes logoIntro {
            0% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.08);
            }
            18% {
                opacity: 0.18;
                transform: translate(-50%, -50%) scale(0.32);
            }
            42% {
                opacity: 0.85;
                transform: translate(-50%, -50%) scale(0.92);
            }
            58% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1);
            }
            100% {
                opacity: 1;
                transform: translate(-50%, -205px) scale(0.88);
            }
        }

        /* ورود نرم متن‌ها از پایین */
        @keyframes contentEnter {
            0% {
                opacity: 0;
                transform: translateY(30px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 480px) {
            .logo-layer {
                width: 130px;
                animation: logoIntroMobile 3.4s cubic-bezier(0.22, 1, 0.36, 1) forwards;
            }

            .content {
                padding-top: 270px;
                animation-delay: 2.95s;
            }

            .main-container {
                padding: 0 16px;
            }

            @keyframes logoIntroMobile {
                0% {
                    opacity: 0;
                    transform: translate(-50%, -50%) scale(0.08);
                }
                18% {
                    opacity: 0.18;
                    transform: translate(-50%, -50%) scale(0.30);
                }
                42% {
                    opacity: 0.85;
                    transform: translate(-50%, -50%) scale(0.90);
                }
                58% {
                    opacity: 1;
                    transform: translate(-50%, -50%) scale(1);
                }
                100% {
                    opacity: 1;
                    transform: translate(-50%, -170px) scale(0.86);
                }
            }
        }
    </style>
</head>
<body>
    <div class="page">
        <div class="logo-layer">
            <img src="image.png" alt="لوگوی تیوان">
        </div>

        <div class="content">
            <div class="main-container">
                <div class="info-item">
                    آدرس: اصفهان - خیابان نظرغربی - سه راه نظر - جنب بانک ملی
                </div>

                <a href="tel:03136264237" class="phone-link">
                    <span>📞</span>
                    <span>03136264237</span>
                </a>
                <br>
                <a href="https://instagram.com/tivan.shop" class="instagram-link" target="_blank" rel="noopener">
                    <span>📸</span>
                    <span>instagram.com/tivan.shop</span>
                </a>

                <div class="button-group">
                    <button class="btn">فرم همکاری</button>
                    <button class="btn">گالری عکس‌ها</button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
