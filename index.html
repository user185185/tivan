<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="icon" type="image/png" href="logo-title-red.png">
    <title>فروشگاه پوشاک تیوان</title>
    
    <style>
        @font-face {
            font-family: 'BNazanin';
            src: url('BNazanin.ttf') format('truetype');
        }

        :root {
            --primary-red: #8B0000; /* زرشکی لوکس */
            --bg-gray: #f4f4f4;     /* طوسی بسیار روشن برای شروع */
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-gray);
            font-family: 'BNazanin', 'B Nazanin', 'Tahoma', sans-serif;
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* --- ۱. لایه انیمیشن (فقط برای شروع کار) --- */
        .intro-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: white;
            z-index: 9999;
            pointer-events: none; /* باعث می‌شود مانع کلیک نشود */
            animation: fadeOutOverlay 0.5s ease-out 3s forwards;
        }

        .intro-logo {
            width: 100px; /* شروع کوچک در موبایل */
            animation: cinematicLogo 3s cubic-bezier(0.65, 0, 0.35, 1) forwards;
        }

        @media (min-width: 768px) {
            .intro-logo { width: 150px; } /* بزرگتر در کامپیوتر */
        }

        @keyframes cinematicLogo {
            0% { transform: scale(0.2); opacity: 0; }
            50% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(1) translateY(-120vh); opacity: 0; } 
            /* حرکت به سمت بالا از کادر خارج می‌شود تا لایه اصلی ظاهر شود */
        }

        @keyframes fadeOutOverlay {
            to { opacity: 0; visibility: hidden; }
        }

        /* --- ۲. محتوای اصلی (هدر واقعی) --- */
        .main-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 30px;
            opacity: 0;
            animation: fadeInMain 1s ease-out 3s forwards; /* بعد از اتمام انیمیشن ظاهر می‌شود */
        }

        /* لوگوی اصلی که در بالا قرار می‌گیرد */
        .header-logo {
            width: 80px; /* کوچکتر برای هماهنگی بهتر */
            transition: width 0.3s ease;
        }

        /* سایز لوگو در کامپیوتر */
        @media (min-width: 768px) {
            .header-logo { width: 110px; }
        }

        .header-logo img {
            width: 100%;
            display: block;
        }

        /* متن زیر لوگو */
        .store-title {
            font-size: 18px; /* کوچکتر برای موبایل */
            color: #333;
            margin-top: 8px;
            font-weight: bold;
        }

        @media (min-width: 768px) {
            .store-title { font-size: 26px; } /* بزرگتر در کامپیوتر */
        }

        @keyframes fadeInMain {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

    </style>
</head>
<body>

    <!-- لایه مخصوص انیمیشن سینمایی (این لایه وقتی تمام شود غیب می‌شود) -->
    <div class="intro-overlay">
        <div class="intro-logo">
            <img src="logo-title-red.png" alt="Logo">
        </div>
    </div>

    <!-- هدر اصلی که در بالا قرار می‌گیرد -->
    <header class="main-header">
        <div class="header-logo">
            <img src="logo-title-red.png" alt="لوگوی فروشگاه پوشاک تیوان">
        </div>
        <div class="store-title">
            فروشگاه پوشاک تیوان
        </div>
    </header>

</body>
</html>
