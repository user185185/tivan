<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>فروشگاه تیوان</title>

<meta name="description" content="فروشگاه پوشاک تیوان">

<link rel="icon" type="image/png" href="logo-title-red-c.png">

<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100;400;500;700&display=swap" rel="stylesheet">

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    background:#fff;
    font-family:'Vazirmatn',sans-serif;
    overflow-x:hidden;
}

.main-container{
    width:100%;
    max-width:550px;
    margin:auto;
    padding:20px;
}

/* ==========================
   لوگو
========================== */

.logo-section{
    height:140px;
    position:relative;
}

.logo-wrapper{

    position:absolute;

    left:50%;
    top:50%;

    width:120px;

    opacity:0;

    transform:translate(-50%,-50%);

    animation:logoIntro 2.5s cubic-bezier(0.65,0,0.35,1) forwards;
}

.logo-wrapper img{
    width:100%;
    display:block;
}

/* ==========================
   محتوا
========================== */

.content-section{

    opacity:0;

    animation:fadeIn 1s ease forwards 2.5s;
}

.branch-item{
    margin-bottom:22px;
}

.branch-address{

    text-align:center;

    color:#444;

    font-size:15px;

    line-height:2;
}

.branch-phone{

    display:block;

    text-align:center;

    text-decoration:none;

    color:#444;

    margin-top:8px;

    font-size:15px;
}

.branch-phone:hover{
    opacity:.8;
}

.branch-divider{

    width:95%;

    max-width:460px;

    height:1px;

    background:#d8d8d8;

    margin:18px auto 0 auto;
}

/* ==========================
   اینستاگرام
========================== */

.instagram-link{

    display:flex;

    justify-content:center;

    align-items:center;

    gap:8px;

    direction:ltr;

    text-decoration:none;

    color:#444;

    margin-top:30px;

    margin-bottom:35px;
}

.instagram-svg{

    width:20px;

    height:20px;

    fill:#E1306C;
}

/* ==========================
   دکمه ها
========================== */

.footer-section{

    opacity:0;

    animation:fadeIn 1s ease forwards 2.5s;
}

.button-group{

    display:flex;

    flex-direction:column;

    align-items:center;

    gap:12px;
}

.btn{

    display:block;

    width:220px;

    text-align:center;

    padding:10px;

    border:1.5px solid #333;

    border-radius:6px;

    color:#333;

    text-decoration:none;

    transition:.3s;
}

.btn:hover{

    background:#333;

    color:#fff;
}

/* ==========================
   انیمیشن
========================== */

@keyframes logoIntro{

    0%{
        opacity:0;
        transform:translate(-50%,50px) scale(.2);
    }

    50%{
        opacity:1;
        transform:translate(-50%,0) scale(1.2);
    }

    100%{
        opacity:1;
        transform:translate(-50%,-60px) scale(1);
    }
}

@keyframes fadeIn{
    to{
        opacity:1;
    }
}

/* ==========================
   موبایل
========================== */

@media(max-width:480px){

    .logo-wrapper{
        width:100px;
    }

    .branch-address{
        font-size:14px;
    }

    .branch-phone{
        font-size:14px;
    }

    .btn{
        width:200px;
    }
}

</style>
</head>

<body>

<div class="main-container">

    <div class="logo-section">

        <div class="logo-wrapper">
            <img src="logo-title-red-c.png" alt="فروشگاه تیوان">
        </div>

    </div>

    <div class="content-section">

        <div class="branch-item">

            <div class="branch-address">
                شعبه مرکزی : اصفهان - خیابان نظرغربی - سه راه نظر - جنب بانک ملی
            </div>

            <a href="tel:03136264237" class="branch-phone">
                ☎ 03136264237
            </a>

            <div class="branch-divider"></div>

        </div>

        <div class="branch-item">

            <div class="branch-address">
                شعبه ۱ : اصفهان - خیابان توحید میانی - ساختمان پاسارگاد - فروشگاه دزیره
            </div>

            <a href="tel:03136264237" class="branch-phone">
                ☎ 03136264237
            </a>

            <div class="branch-divider"></div>

        </div>

        <div class="branch-item">

            <div class="branch-address">
                شعبه ۲ : اصفهان - دروازه شیراز - ابتدای چهارباغ بالا
            </div>

            <a href="tel:03136610848" class="branch-phone">
                ☎ 03136610848
            </a>

            <div class="branch-divider"></div>

        </div>

        <a href="https://instagram.com/tivan.shop"
           target="_blank"
           rel="noopener noreferrer"
           class="instagram-link">

            <svg class="instagram-svg" viewBox="0 0 24 24">
                <path d="M7,2C4.24,2 2,4.24 2,7V17C2,19.76 4.24,22 7,22H17C19.76,22 22,19.76 22,17V7C22,4.24 19.76,2 17,2H7M18,4A1,1 0 0,1 19,5A1,1 0 0,1 18,6A1,1 0 0,1 17,5A1,1 0 0,1 18,4M12,7A5,5 0 0,1 17,12A5,5 0 0,1 12,17A5,5 0 0,1 7,12A5,5 0 0,1 12,7M12,9A3,3 0 0,0 9,12A3,3 0 0,0 12,15A3,3 0 0,0 15,12A3,3 0 0,0 12,9Z"/>
            </svg>

            <span>instagram.com/tivan.shop</span>

        </a>

    </div>

    <div class="footer-section">

        <div class="button-group">

            <a href="hamkari.html" class="btn">
                فرم همکاری
            </a>

            <a href="gallery.html" class="btn">
                گالری عکس‌ها
            </a>

        </div>

    </div>

</div>

</body>
</html>
