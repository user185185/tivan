<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فروشگاه تیوان</title>
    <meta name="description" content="فروشگاه پوشاک تیوان">
    <link rel="icon" type="image/png" href="logo-title-red-c.png">
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100;400;500;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { min-height: 100vh; background: #fff; font-family: 'Vazirmatn', sans-serif; overflow-x: hidden; }
        .main-container { width: 100%; max-width: 550px; margin: auto; padding: 20px; position: relative; }
        .logo-section { position: relative; height: 170px; width: 100%; overflow: visible; }
        .logo-wrapper { position: absolute; left: 50%; width: 120px; opacity: 0; animation: logoIntro 2.5s cubic-bezier(0.65,0,0.35,1) forwards; z-index: 100; }
        .logo-wrapper img { width: 100%; display: block; }
        .content-section { opacity: 0; animation: fadeIn 1s ease forwards 2.5s; }
        .branch-item { margin-bottom: 12px; }
        .branch-address { text-align: center; color: #444; font-size: 15px; line-height: 1.8; }
        .branch-links { display: flex; justify-content: center; align-items: center; gap: 24px; margin-top: 8px; }
        .branch-link { display: flex; align-items: center; gap: 6px; text-decoration: none; color: #444; font-size: 15px; cursor: pointer; }
        .branch-link:hover { opacity: .7; }
        .phone-link { direction: ltr; }
        .phone-svg { width: 18px; height: 18px; fill: #34C759; }
        .location-svg { width: 20px; height: 20px; fill: #FF3B30; }
        .branch-divider { width: 90%; max-width: 420px; height: 1px; background: #d6d6d6; margin: 12px auto 0 auto; }
        .instagram-section { display: flex; justify-content: center; align-items: center; margin-top: 18px; margin-bottom: 18px; }
        .instagram-link { display: flex; align-items: center; gap: 8px; direction: ltr; text-decoration: none; color: #444; font-size: 15px; font-weight: 500; padding: 6px 14px; border-radius: 10px; }
        .instagram-link:hover { background: #f5f5f5; }
        .instagram-svg { width: 22px; height: 22px; }
        .footer-section { opacity: 0; animation: fadeIn 1s ease forwards 2.5s; text-align: center; margin-top: 20px; }
        .button-group { display: flex; justify-content: center; align-items: center; gap: 8px; width: 100%; max-width: 480px; margin: 0 auto; }
        .btn { flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none; color: #0f172a; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; padding: 12px 6px; font-size: 12px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
        .btn:hover { background: #0f172a; color: #fff; transform: translateY(-2px); }
        .btn svg { width: 15px; height: 15px; fill: currentColor; }
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.4); backdrop-filter: blur(8px); display: flex; justify-content: center; align-items: center; z-index: 2000; opacity: 0; visibility: hidden; transition: 0.3s; }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        .custom-modal { background: #fff; width: 90%; max-width: 380px; padding: 28px 24px; border-radius: 20px; text-align: center; transform: scale(0.9); transition: 0.3s; }
        .modal-overlay.active .custom-modal { transform: scale(1); }
        .club-input { width: 100%; padding: 14px; border: 1.5px solid #e2e8f0; border-radius: 12px; font-size: 16px; text-align: center; margin-bottom: 12px; outline: none; }
        .club-submit-btn { width: 100%; padding: 14px; background: #0f172a; color: #fff; border: none; border-radius: 12px; font-weight: 700; cursor: pointer; }
        .form-feedback { font-size: 13px; margin-top: 10px; display: none; }
        .app-btn { display: flex; align-items: center; padding: 14px 20px; border: 1px solid #eaeaea; border-radius: 14px; text-decoration: none; color: #333; margin-bottom: 10px; gap: 16px; }
        @keyframes logoIntro { 0%{ opacity:0; top:50vh; transform:translate(-50%, -50%) scale(.2); } 100%{ opacity:1; top:30px; transform:translate(-50%, 0) scale(1); } }
        @keyframes fadeIn { to{ opacity:1; } }
    </style>
</head>

<body>
    <div class="main-container">
        <div class="logo-section">
            <div class="logo-wrapper"><img src="logo-title-red-c.png" alt="فروشگاه تیوان"></div>
        </div>

        <div class="content-section">
            <div class="branch-item">
                <div class="branch-address">شعبه مرکزی : اصفهان - خیابان نظرغربی - سه راه نظر - جنب بانک ملی</div>
                <div class="branch-links">
                    <a href="tel:03136264237" class="branch-link phone-link"><span>03136264237</span></a>
                    <div class="branch-link open-map-trigger" data-lat="32.6380318" data-lng="51.6435897">مسیریابی</div>
                </div>
                <div class="branch-divider"></div>
            </div>
            <div class="footer-section">
                <div class="button-group">
                    <div class="btn" id="openClubBtn">باشگاه مشتریان</div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="clubModalOverlay">
        <div class="custom-modal">
            <div class="modal-title">عضویت در باشگاه مشتریان</div>
            <input type="tel" id="clientPhone" class="club-input" placeholder="شماره موبایل" maxlength="11">
            <button id="submitPhoneBtn" class="club-submit-btn">تایید و ثبت</button>
            <div id="formFeedback" class="form-feedback"></div>
            <button class="close-modal-btn" id="closeClubModalBtn" style="margin-top:20px; border:none; background:none; cursor:pointer;">انصراف</button>
        </div>
    </div>

    <div class="modal-overlay" id="mapModalOverlay">
        <div class="custom-modal">
            <div class="app-btn" id="link-google">گوگل مپ</div>
            <div class="app-btn" id="link-neshan">نشان</div>
            <button class="close-modal-btn" id="closeMapModalBtn" style="border:none; background:none; cursor:pointer;">انصراف</button>
        </div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', function() {
        // Map Logic
        document.querySelectorAll('.open-map-trigger').forEach(trigger => {
            trigger.addEventListener('click', function() {
                const lat = this.getAttribute('data-lat');
                const lng = this.getAttribute('data-lng');
                document.getElementById('link-google').onclick = () => window.open(`https://www.google.com/maps/search/?api=1&query=${lat},${lng}`);
                document.getElementById('link-neshan').onclick = () => window.open(`https://neshan.org/maps/search/${lat}/${lng}`);
                document.getElementById('mapModalOverlay').classList.add('active');
            });
        });

        // Club Logic
        const clubOverlay = document.getElementById('clubModalOverlay');
        document.getElementById('openClubBtn').addEventListener('click', () => clubOverlay.classList.add('active'));
        document.getElementById('closeClubModalBtn').addEventListener('click', () => clubOverlay.classList.remove('active'));
        document.getElementById('closeMapModalBtn').addEventListener('click', () => document.getElementById('mapModalOverlay').classList.remove('active'));

        document.getElementById('submitPhoneBtn').addEventListener('click', function() {
            const phone = document.getElementById('clientPhone').value.trim();
            const feedback = document.getElementById('formFeedback');
            if (!/^09[0-9]{9}$/.test(phone)) {
                feedback.innerText = 'شماره معتبر نیست';
                feedback.style.display = 'block';
                return;
            }
            
            feedback.innerText = 'در حال ثبت...';
            feedback.style.display = 'block';

            fetch('https://tivansms.tiva1shop-kh8xv.arvanedge.ir?phone=' + phone)
            .then(res => res.json())
            .then(data => {
                feedback.innerText = data.message || 'ثبت انجام شد';
            }).catch(() => {
                feedback.innerText = 'خطا در ارتباط با سرور';
            });
        });
    });
    </script>
</body>
</html>
