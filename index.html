<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فروشگاه تیوان</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: 'Vazirmatn', sans-serif;
            overflow: hidden;
            background: #fff;
        }

        .page {
            position: relative;
            width: 100%;
            height: 100vh;
        }

        /* لوگوی مستقل */
        .logo-layer {
            position: fixed;
            top: 50%;
            left: 50%;
            width: 150px;
            z-index: 20;
            pointer-events: none;
            will-change: transform, opacity;
            animation: logoIntro 2.8s cubic-bezier(0.25, 0.1, 0.25, 1) forwards;
        }

        .logo-layer img {
            width: 100%;
            display: block;
        }

        /* محتوای اصلی */
        .content {
            position: absolute;
            top: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            padding-top: 300px;
            opacity: 0;
            animation: contentEnter 1s ease-out forwards 2.35s;
        }

        .main-container {
            width: 100%;
            max-width: 500px;
            text-align: center;
        }

        .info-item {
            font-size: 16px;
            color: #333;
            margin-bottom: 20px;
            line-height: 1.8;
        }

        .phone-link,
        .instagram-link {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: #333;
            margin: 5px 0;
            padding: 8px;
            direction: ltr;
            unicode-bidi: isolate;
            white-space: nowrap;
        }

        .button-group {
            margin-top: 30px;
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 10px 25px;
            border: 2px solid #333;
            background: transparent;
            cursor: pointer;
            font-family: 'Vazirmatn', sans-serif;
            border-radius: 8px;
            transition: 0.3s;
        }

        .btn:hover {
            background: #333;
            color: #fff;
        }

        /* انیمیشن نرم‌تر لوگو */
        @keyframes logoIntro {
            0% {
                transform: translate(-50%, -50%) scale(0.12);
                opacity: 0;
            }
            20% {
                opacity: 0.35;
                transform: translate(-50%, -50%) scale(0.45);
            }
            45% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1);
            }
            65% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1);
            }
            100% {
                opacity: 1;
                transform: translate(-50%, -210px) scale(0.85);
            }
        }

        /* ورود نرم محتوا از پایین */
        @keyframes contentEnter {
            0% {
                opacity: 0;
                transform: translateY(28px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 480px) {
            .logo-layer {
                width: 120px;
                animation: logoIntroMobile 2.8s cubic-bezier(0.25, 0.1, 0.25, 1) forwards;
            }

            .content {
                padding-top: 270px;
                animation-delay: 2.35s;
            }

            @keyframes logoIntroMobile {
                0% {
                    transform: translate(-50%, -50%) scale(0.12);
                    opacity: 0;
                }
                20% {
                    opacity: 0.35;
                    transform: translate(-50%, -50%) scale(0.42);
                }
                45% {
                    opacity: 1;
                    transform: translate(-50%, -50%) scale(1);
                }
                65% {
                    opacity: 1;
                    transform: translate(-50%, -50%) scale(1);
                }
                100% {
                    opacity: 1;
                    transform: translate(-50%, -175px) scale(0.84);
                }
            }
        }
    </style>
</head>
<body>

    <div class="page">
        <div class="logo-layer">
            <img src="image.png" alt="لوگوی تیوان">
        </div>

        <div class="content">
            <div class="main-container">
                <div class="info-item">
                    آدرس: اصفهان - خیابان نظرغربی - سه راه نظر - جنب بانک ملی
                </div>

                <a href="tel:03136264237" class="phone-link">
                    <span>📞</span> 03136264237
                </a>
                <br>
                <a href="https://instagram.com/tivan.shop" class="instagram-link">
                    <span>📸</span> instagram.com/tivan.shop
                </a>

                <div class="button-group">
                    <button class="btn">فرم همکاری</button>
                    <button class="btn">گالری عکس‌ها</button>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
