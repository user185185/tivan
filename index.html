<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فروشگاه تیوان</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        html, body {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            font-family: 'Vazirmatn', sans-serif;
            overflow: hidden;
            background: #fff;
        }

        .page { position: relative; width: 100%; height: 100vh; }

        /* لوگوی مستقل */
        .logo-layer {
            position: fixed;
            top: 50%;
            left: 50%;
            width: 150px; /* اندازه پایه */
            z-index: 20;
            pointer-events: none;
            animation: logoIntro 2.1s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        .logo-layer img { width: 100%; display: block; }

        /* محتوای اصلی */
        .content {
            position: absolute;
            top: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            padding-top: 320px; /* فاصله از بالای صفحه برای قرارگیری زیر لوگوی مستقر در -210px */
            opacity: 0;
            animation: contentEnter 1s ease forwards 1.8s;
        }

        .main-container {
            width: 100%;
            max-width: 500px;
            text-align: center;
        }

        .info-item { font-size: 16px; color: #333; margin-bottom: 20px; line-height: 1.8; }

        .phone-link, .instagram-link {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: #333;
            margin: 5px 0;
            padding: 8px;
            direction: ltr;
            unicode-bidi: isolate;
        }

        .button-group { margin-top: 30px; display: flex; gap: 15px; justify-content: center; }

        .btn {
            padding: 10px 25px;
            border: 2px solid #333;
            background: transparent;
            cursor: pointer;
            font-family: 'Vazirmatn', sans-serif;
            border-radius: 8px;
            transition: 0.3s;
        }

        .btn:hover { background: #333; color: #fff; }

        /* انیمیشن لوگو */
        @keyframes logoIntro {
            0% { opacity: 0; transform: translate(-50%, -50%) scale(0.2); }
            30% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
            50% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
            100% { opacity: 1; transform: translate(-50%, -210px) scale(0.85); }
        }

        /* انیمیشن ورود متن */
        @keyframes contentEnter {
            0% { opacity: 0; transform: translateY(30px); }
            100% { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="page">
        <div class="logo-layer">
            <img src="logo-title-red.png" alt="تیوان">
        </div>

        <div class="content">
            <div class="main-container">
                <div class="info-item">
                    آدرس: اصفهان - خیابان نظرغربی - سه راه نظر - جنب بانک ملی
                </div>

                <a href="tel:03136264237" class="phone-link">
                    <span>📞</span> 03136264237
                </a>
                <br>
                <a href="https://instagram.com/tivan.shop" class="instagram-link">
                    <span>📸</span> instagram.com/tivan.shop
                </a>

                <div class="button-group">
                    <button class="btn">فرم همکاری</button>
                    <button class="btn">گالری عکس‌ها</button>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
