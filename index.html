<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>فروشگاه تیوان</title>
<meta name="description" content="فروشگاه پوشاک تیوان">

<link rel="icon" type="image/png" href="logo-title-red-c.png">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100;400;500;700&display=swap" rel="stylesheet">

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    background:#fff;
    font-family:'Vazirmatn',sans-serif;
    overflow-x:hidden;
}

.main-container{
    width:100%;
    max-width:550px;
    margin:auto;
    padding:20px;
}

.logo-section{
    position:relative;
    height:180px;
    overflow:hidden;
}

.logo-wrapper{
    position:fixed;
    left:50%;
    top:50%;
    width:120px;
    opacity:0;
    transform:translate(-50%,-50%);
    animation:logoIntro 2.5s cubic-bezier(0.65,0,0.35,1) forwards;
    z-index:100;
    will-change:transform, top, opacity;
}

.logo-wrapper img{
    width:100%;
    display:block;
}

.content-section{
    opacity:0;
    animation:fadeIn 1s ease forwards 2.5s;
}

.branch-item{
    margin-bottom:8px;
}

.branch-address{
    text-align:center;
    color:#444;
    font-size:15px;
    line-height:1.8;
}

.branch-phone{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:8px;
    direction:ltr;

    text-decoration:none;
    color:#444;
    margin-top:6px;
    font-size:15px;
    transition:0.2s ease;
}

.branch-phone:hover{
    opacity:.8;
}

.phone-svg{
    width:18px;
    height:18px;
    fill:#34C759;
    flex-shrink:0;
}

.branch-divider{
    width:90%;
    max-width:420px;
    height:1px;
    background:#d6d6d6;
    margin:8px auto 0 auto;
}

.instagram-link{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:8px;
    direction:ltr;
    text-decoration:none;
    color:#444;
    margin-top:18px;
    margin-bottom:18px;
}

.instagram-link:hover{
    opacity:.8;
}

.instagram-svg{
    width:20px;
    height:20px;
    fill:#E1306C;
}

.footer-section{
    opacity:0;
    animation:fadeIn 1s ease forwards 2.5s;
    text-align:center;
    margin-top:18px;
}

.button-group{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:12px;
    flex-wrap:nowrap;
}

.btn{
    display:inline-block;
    min-width:160px;
    padding:10px 24px;
    border:1.5px solid #333;
    border-radius:6px;
    text-decoration:none;
    color:#333;
    transition:.3s;
}

.btn:hover{
    background:#333;
    color:#fff;
}

.footer-divider{
    width:90%;
    max-width:420px;
    height:1px;
    background:#d6d6d6;
    margin:18px auto 0 auto;
}

@keyframes logoIntro{
    0%{
        opacity:0;
        top:50%;
        transform:translate(-50%,-50%) scale(.2);
    }
    50%{
        opacity:1;
        top:50%;
        transform:translate(-50%,-50%) scale(1.2);
    }
    100%{
        opacity:1;
        top:20px;
        transform:translate(-50%,0) scale(1);
    }
}

@keyframes fadeIn{
    to{
        opacity:1;
    }
}

@media(max-width:480px){
    .logo-wrapper{
        width:100px;
    }

    .logo-section{
        height:160px;
    }

    .branch-address{
        font-size:14px;
    }

    .branch-phone{
        font-size:14px;
    }

    .button-group{
        gap:10px;
    }

    .btn{
        width:calc(50% - 5px);
        min-width:0;
        padding:10px 12px;
        font-size:13px;
    }
}
</style>
</head>

<body>

        <div class="footer-divider"></div>
    </div>

</div>

<script>
(function () {
    const logoWrapper = document.getElementById('logoWrapper');
    const logoSection = document.getElementById('logoSection');

    function syncLogoSectionHeight() {
        const logoRect = logoWrapper.getBoundingClientRect();
        const height = Math.ceil(logoRect.height + 50);
        logoSection.style.height = height + 'px';
    }

    function settleLogo() {
        logoWrapper.style.animation = 'none';
        logoWrapper.style.position = 'absolute';
        logoWrapper.style.left = '50%';
        logoWrapper.style.top = '20px';
        logoWrapper.style.transform = 'translateX(-50%)';
        logoWrapper.style.opacity = '1';
        syncLogoSectionHeight();
    }

    window.addEventListener('load', () => {
        syncLogoSectionHeight();
        requestAnimationFrame(syncLogoSectionHeight);
    });

    window.addEventListener('resize', syncLogoSectionHeight);
    logoWrapper.addEventListener('animationend', settleLogo);
})();
</script>

</body>
</html>
