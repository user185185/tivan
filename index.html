<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فروشگاه تیوان</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: #ffffff;
            font-family: 'Vazirmatn', sans-serif;
            text-align: center;
        }

        .main-container { width: 100%; display: flex; flex-direction: column; align-items: center; }

        .logo-wrapper { width: 150px; margin-bottom: 10px; }
        .logo-wrapper img { width: 100%; }

        .info-container {
            padding: 0 20px;
            max-width: 600px;
            direction: rtl;
        }

        /* بخش آدرس و تلفن که مشکل داشت */
        .address-text {
            font-size: 16px;
            color: #333;
            line-height: 2;
            margin-bottom: 10px;
            /* این دو دستور باعث می‌شود شماره به ابتدای سطر نپرد */
            unicode-bidi: isolate; 
        }

        .phone-link {
            display: inline-flex;
            align-items: center;
            text-decoration: none;
            color: #333;
            font-weight: 500;
            white-space: nowrap;
            margin-right: 8px; /* فاصله از متن آدرس */
        }

        .phone-svg { 
            width: 18px; 
            height: 18px; 
            fill: #25D366; 
            margin-right: 6px; 
            vertical-align: middle;
        }

        .instagram-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-decoration: none;
            color: #333;
            margin-bottom: 25px;
        }

        .instagram-icon { width: 20px; }

        .button-group { display: flex; gap: 15px; justify-content: center; }

        .btn {
            padding: 8px 20px;
            border: 1px solid #333;
            background: transparent;
            cursor: pointer;
            font-family: 'Vazirmatn', sans-serif;
            border-radius: 5px;
            transition: 0.3s;
        }

        .btn:hover { background: #333; color: #fff; }
    </style>
</head>
<body>

    <div class="main-container">
        <div class="logo-wrapper">
            <img src="logo-title-red.png" alt="لوگوی تیوان">
        </div>

        <div class="info-container">
            <!-- متن آدرس و تلفن به صورت یک پاراگراف واحد -->
            <p class="address-text">
                آدرس فروشگاه: اصفهان - خیابان نظرغربی - سه راه نظر - جنب بانک ملی 
                <a href="tel:03136264237" class="phone-link">
                    <svg class="phone-svg" viewBox="0 0 24 24"><path d="M6.62,10.79C8.06,13.62 10.38,15.94 13.21,17.38L15.41,15.18C15.69,14.9 16.08,14.82 16.43,14.93C17.55,15.3 18.75,15.5 20,15.5A1,1 0 0,1 21,16.5V20A1,1 0 0,1 20,21A17,17 0 0,1 3,4A1,1 0 0,1 4,3H7.5A1,1 0 0,1 8.5,4C8.5,5.25 8.7,6.45 9.07,7.57C9.18,7.92 9.1,8.31 8.82,8.59L6.62,10.79Z"/></svg>
                    03136264237
                </a>
            </p>

            <a href="https://instagram.com/tivan.shop" target="_blank" class="instagram-link">
                <img class="instagram-icon" src="https://upload.wikimedia.org/wikipedia/commons/a/a5/Instagram_icon.png" alt="Instagram">
                <span>instagram.com/tivan.shop</span>
            </a>
            
            <div class="button-group">
                <button class="btn">فرم همکاری</button>
                <button class="btn">گالری عکس‌ها</button>
            </div>
        </div>
    </div>

</body>
</html>
