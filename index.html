<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- عنوان سایت در تب مرورگر -->
    <title>فروشگاه پوشاک تیوان</title>
    
    <style>
        /* تنظیمات پایه برای نمایش صحیح در موبایل و دسکتاپ */
        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: #ffffff; /* فعلاً سفید ساده برای دیدن وضوح لوگو */
            font-family: 'Tahoma', sans-serif; /* فعلاً فونت سیستمی */
        }

        /* کانتینر لوگو */
        .logo-wrapper {
            width: 200px; /* اندازه لوگو را اینجا می‌توانید بزرگ یا کوچک کنید */
            height: auto;
            margin-bottom: 15px;
            transition: transform 0.3s ease; /* یک افکت نرم برای بعداً */
        }

        .logo-wrapper img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* استایل نام فروشگاه */
        .store-title {
            font-size: 24px;
            color: #333;
            font-weight: bold;
            letter-spacing: -0.5px;
        }

        /* افکت کوچک برای جذابیت در موبایل */
        .logo-wrapper:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <!-- نمایش لوگوی آپلود شده شما -->
    <div class="logo-wrapper">
        <img src="logo-title-red.png" alt="لوگوی فروشگاه پوشاک تیوان">
    </div>

    <!-- نمایش نام فروشگاه -->
    <div class="store-title">
        فروشگاه پوشاک تیوان
    </div>

</body>
</html>
