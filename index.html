<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فروشگاه تیوان</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            min-height: 100%;
            width: 100%;
            background: #fff;
            font-family: 'Vazirmatn', sans-serif;
            overflow-x: hidden;
        }

        body {
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        .page {
            position: relative;
            min-height: 100vh;
            width: 100%;
        }

        /* لوگوی مستقل */
        .logo-layer {
            position: fixed;
            top: 50%;
            left: 50%;
            width: 128px;
            transform: translate(-50%, -50%) scale(0);
            transform-origin: center center;
            z-index: 20;
            pointer-events: none;
            opacity: 0;
            animation: logoIntro 2.8s cubic-bezier(0.22, 1, 0.36, 1) forwards;
            will-change: transform, opacity;
        }

        .logo-layer img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* محتوای اصلی */
        .content {
            min-height: 100vh;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding-top: 250px;
            opacity: 0;
            transform: translateY(24px);
            animation: contentEnter 0.9s cubic-bezier(0.22, 1, 0.36, 1) forwards 2.35s;
        }

        .main-container {
            width: 100%;
            max-width: 520px;
            padding: 20px;
            text-align: center;
        }

        .info-item {
            font-size: 15px;
            color: #444;
            margin-bottom: 14px;
            line-height: 2;
            overflow-wrap: break-word;
        }

        .phone-link,
        .instagram-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-decoration: none;
            color: #444;
            margin: 6px 0;
            padding: 6px 12px;
            transition: transform 0.25s ease, opacity 0.25s ease;
            direction: ltr;
            unicode-bidi: isolate;
        }

        .phone-link:hover,
        .instagram-link:hover {
            transform: scale(1.05);
        }

        .phone-svg {
            width: 20px;
            height: 20px;
            fill: #25D366;
            display: block;
            flex: 0 0 auto;
        }

        .instagram-icon {
            width: 20px;
            height: 20px;
            display: block;
            flex: 0 0 auto;
        }

        .phone-text,
        .instagram-text {
            font-size: 15px;
            color: #444;
            white-space: nowrap;
            direction: ltr;
            unicode-bidi: isolate;
        }

        .button-group {
            margin-top: 26px;
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 8px 22px;
            border: 1.5px solid #333;
            background: transparent;
            cursor: pointer;
            font-family: 'Vazirmatn', sans-serif;
            font-size: 14px;
            font-weight: 500;
            border-radius: 6px;
            transition: all 0.25s ease;
        }

        .btn:hover {
            background: #333;
            color: #fff;
            transform: translateY(-1px);
        }

        /* لوگو: نرم، حرفه‌ای، بدون پرش */
        @keyframes logoIntro {
            0% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.08) translateY(35px);
            }
            18% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(0.45) translateY(18px);
            }
            45% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1.08) translateY(0px);
            }
            68% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1.03) translateY(-62px);
            }
            100% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1) translateY(-210px);
            }
        }

        /* متن‌ها از پایین اسلاید بخورند */
        @keyframes contentEnter {
            0% {
                opacity: 0;
                transform: translateY(28px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 480px) {
            .logo-layer {
                width: 108px;
                animation: logoIntroMobile 2.8s cubic-bezier(0.22, 1, 0.36, 1) forwards;
            }

            .content {
                padding-top: 210px;
                animation-delay: 2.3s;
            }

            @keyframes logoIntroMobile {
                0% {
                    opacity: 0;
                    transform: translate(-50%, -50%) scale(0.08) translateY(28px);
                }
                18% {
                    opacity: 1;
                    transform: translate(-50%, -50%) scale(0.42) translateY(14px);
                }
                45% {
                    opacity: 1;
                    transform: translate(-50%, -50%) scale(1.06) translateY(0px);
                }
                68% {
                    opacity: 1;
                    transform: translate(-50%, -50%) scale(1.02) translateY(-50px);
                }
                100% {
                    opacity: 1;
                    transform: translate(-50%, -50%) scale(1) translateY(-108px);
                }
            }
        }
    </style>
</head>
<body>

    <div class="page">
        <div class="logo-layer">
            <img src="logo-title-red.png" alt="لوگوی فروشگاه تیوان">
        </div>

        <div class="content">
            <div class="main-container">
                <div class="info-item">
                    آدرس فروشگاه: اصفهان - خیابان نظرغربی - سه راه نظر - جنب بانک ملی
                </div>

                <a href="tel:03136264237" class="phone-link">
                    <svg class="phone-svg" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M6.62,10.79C8.06,13.62 10.38,15.94 13.21,17.38L15.41,15.18C15.69,14.9 16.08,14.82 16.43,14.93C17.55,15.3 18.75,15.5 20,15.5A1,1 0 0,1 21,16.5V20A1,1 0 0,1 20,21A17,17 0 0,1 3,4A1,1 0 0,1 4,3H7.5A1,1 0 0,1 8.5,4C8.5,5.25 8.7,6.45 9.07,7.57C9.18,7.92 9.1,8.31 8.82,8.59L6.62,10.79Z"/>
                    </svg>
                    <span class="phone-text">03136264237</span>
                </a>

                <a href="https://instagram.com/tivan.shop" target="_blank" class="instagram-link" rel="noopener noreferrer">
                    <img class="instagram-icon" src="https://upload.wikimedia.org/wikipedia/commons/a/a5/Instagram_icon.png" alt="Instagram">
                    <span class="instagram-text">instagram.com/tivan.shop</span>
                </a>

                <div class="button-group">
                    <button class="btn">فرم همکاری</button>
                    <button class="btn">گالری عکس‌ها</button>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
