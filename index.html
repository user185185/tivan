<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- آیکون تب مرورگر -->
    <link rel="icon" type="image/png" href="logo-title-red.png">
    
    <title>فروشگاه پوشاک تیوان</title>
    
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: #ffffff;
            font-family: 'Tahoma', sans-serif;
            overflow: hidden;
        }

        .main-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .logo-wrapper {
            width: 120px;
            height: auto;
            opacity: 0;
            animation: introAnimation 2.5s cubic-bezier(0.65, 0, 0.35, 1) forwards;
        }

        .logo-wrapper img {
            width: 100%;
            height: auto;
            display: block;
        }

        @keyframes introAnimation {
            0% {
                opacity: 0;
                transform: scale(0.2);
            }
            50% {
                opacity: 1;
                transform: scale(1.2);
            }
            100% {
                opacity: 1;
                transform: scale(1) translateY(-180px);
            }
        }
    </style>
</head>
<body>

    <div class="main-container">
        <div class="logo-wrapper">
            <img src="logo-title-red.png" alt="لوگوی فروشگاه پوشاک تیوان">
        </div>
    </div>

</body>
</html>
