<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="logo-title-red.png">
    <title>فروشگاه تیوان</title>
    
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: #ffffff;
            font-family: 'Tahoma', sans-serif;
            overflow: hidden;
        }

        .main-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .logo-wrapper {
            width: 120px;
            height: auto;
            opacity: 0;
            /* انیمیشن اصلی شامل دو بخش است: حرکت و رنگی شدن */
            animation: 
                introAnimation 2.5s cubic-bezier(0.65, 0, 0.35, 1) forwards,
                colorReveal 2s ease-in-out 1.5s forwards; /* شروع رنگی شدن از ثانیه ۱.۵ */
        }

        .logo-wrapper img {
            width: 100%;
            height: auto;
            display: block;
            /* در ابتدا لوگو کاملاً سیاه و سفید است */
            filter: grayscale(100%);
        }

        .info-container {
            margin-top: 20px;
            opacity: 0;
            animation: fadeIn 1s ease forwards 2.5s;
            line-height: 2;
        }

        .info-item { font-size: 14px; color: #555; margin-bottom: 5px; }

        .button-group {
            margin-top: 20px;
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        .btn {
            padding: 10px 20px;
            border: 1px solid #333;
            background: transparent;
            cursor: pointer;
            font-family: 'Tahoma', sans-serif;
            transition: 0.3s;
        }
        .btn:hover { background: #333; color: #fff; }

        /* --- انیمیشن‌ها --- */

        /* ۱. انیمیشن حرکت به بالا (همان کد قبلی شما) */
        @keyframes introAnimation {
            0% { opacity: 0; transform: scale(0.2); }
            50% { opacity: 1; transform: scale(1.2); }
            100% { opacity: 1; transform: scale(1) translateY(-220px); }
        }

        /* ۲. انیمیشن تبدیل سیاه و سفید به رنگی */
        @keyframes colorReveal {
            0% {
                filter: grayscale(100%);
            }
            100% {
                filter: grayscale(0%);
            }
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="main-container">
        <div class="logo-wrapper">
            <img src="logo-title-red.png" alt="لوگوی فروشگاه پوشاک تیوان">
        </div>

        <div class="info-container">
            <div class="info-item">آدرس فروشگاه : اصفهان - خیابان نظر غربی - سه راه نظر - جنب بانک ملی</div>
            <div class="info-item">تلفن فروشگاه : 03136264237</div>
            <div class="info-item">آدرس اینستاگرام : instagram.com/tivan.shop</div>
            
            <div class="button-group">
                <button class="btn">استخدام</button>
                <button class="btn">دیدن عکس‌های فروشگاه</button>
            </div>
        </div>
    </div>

</body>
</html>
