<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>فروشگاه تیوان</title>
<style>
/* ... (تمام استایل‌های شما کاملاً درست هستند و نیازی به تغییر ندارند) ... */
</style>
</head>

<body>

<script>
(function() {
    // منطق نقشه (بدون تغییر)
    var mapTriggers = document.querySelectorAll('.open-map-trigger');
    var mapOverlay = document.getElementById('mapModalOverlay');
    var closeMapBtn = document.getElementById('closeMapModalBtn');
    var googleLink = document.getElementById('link-google');
    var neshanLink = document.getElementById('link-neshan');
    var baladLink = document.getElementById('link-balad');

    mapTriggers.forEach(function(trigger) {
        trigger.addEventListener('click', function() {
            var lat = this.getAttribute('data-lat');
            var lng = this.getAttribute('data-lng');
            googleLink.href = 'https://www.google.com/maps/search/?api=1&query=' + lat + ',' + lng;
            neshanLink.href = 'https://neshan.org/maps/search/' + lat + ',' + lng;
            baladLink.href = 'https://balad.ir/location?lat=' + lat + '&lng=' + lng;
            mapOverlay.classList.add('active');
        });
    });

    closeMapBtn.addEventListener('click', function() { mapOverlay.classList.remove('active'); });

    // منطق باشگاه مشتریان (آپدیت شده برای هماهنگی با ورکر آروان)
    var openClubBtn = document.getElementById('openClubBtn');
    var clubOverlay = document.getElementById('clubModalOverlay');
    var closeClubBtn = document.getElementById('closeClubModalBtn');
    var submitPhoneBtn = document.getElementById('submitPhoneBtn');
    var clientPhoneInput = document.getElementById('clientPhone');
    var formFeedback = document.getElementById('formFeedback');

    openClubBtn.addEventListener('click', function() {
        formFeedback.className = 'form-feedback';
        formFeedback.innerText = '';
        clientPhoneInput.value = '';
        clubOverlay.classList.add('active');
    });

    closeClubBtn.addEventListener('click', function() { clubOverlay.classList.remove('active'); });

    window.addEventListener('click', function(e) {
        if (e.target === mapOverlay) mapOverlay.classList.remove('active');
        if (e.target === clubOverlay) clubOverlay.classList.remove('active');
    });

    submitPhoneBtn.addEventListener('click', function() {
        var phone = clientPhoneInput.value.trim();
        var phoneRegex = /^09[0-9]{9}$/;
        if (!phoneRegex.test(phone)) {
            formFeedback.className = 'form-feedback error';
            formFeedback.innerText = 'لطفاً یک شماره موبایل معتبر ۱۱ رقمی وارد کنید.';
            return;
        }

        formFeedback.className = 'form-feedback';
        formFeedback.innerText = 'در حال ثبت...';
        submitPhoneBtn.disabled = true;

        var arvanWorkerUrl = 'https://tivansms.tiva1shop-kh8xv.arvanedge.ir';

        fetch(arvanWorkerUrl + '?phone=' + phone)
        .then(function(response) { return response.json(); })
        .then(function(data) {
            submitPhoneBtn.disabled = false;
            
            // حالا بر اساس status که در آروان تعریف کردیم، رفتار می‌کنیم
            if (data.status === 'success') {
                formFeedback.className = 'form-feedback success';
                formFeedback.innerText = data.message;
                setTimeout(function() { clubOverlay.classList.remove('active'); }, 3000);
            } else if (data.status === 'exists') {
                formFeedback.className = 'form-feedback error';
                formFeedback.innerText = data.message; // "این شماره قبلاً ثبت شده..."
            } else {
                formFeedback.className = 'form-feedback error';
                formFeedback.innerText = data.message || 'خطای غیرمنتظره.';
            }
        })
        .catch(function(error) {
            submitPhoneBtn.disabled = false;
            formFeedback.className = 'form-feedback error';
            formFeedback.innerText = 'خطای ارتباط با سرور.';
        });
    });
})();
</script>

</body>
</html>
