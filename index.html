<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="logo-title-red.png">
    <title>فروشگاه تیوان</title>
    
    <!-- فراخوانی فونت استاندارد فارسی از گوگل -->
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100;400;700&display=swap" rel="stylesheet">
    
    <style>
        /* --- بخش استایل‌ها (CSS) --- */
        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: #ffffff;
            font-family: 'Vazirmatn', sans-serif;
            overflow: hidden;
        }

        .main-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            width: 100%; /* اضافه شده برای کنترل بهتر */
        }

        .logo-wrapper {
            width: 120px;
            height: auto;
            opacity: 0;
            animation: introAnimation 2.5s cubic-bezier(0.65, 0, 0.35, 1) forwards;
        }

        .logo-wrapper img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* --- بخش اصلاح شده برای فاصله از کناره‌ها --- */
        .info-container {
            margin-top: -60px; 
            opacity: 0;
            animation: fadeIn 1s ease forwards 2.5s; 
            line-height: 1.8;
            
            /* تنظیمات جدید برای جلوگیری از چسبیدن به کناره‌ها */
            padding: 0 20px; /* ایجاد فاصله ۲۰ پیکسلی از چپ و راست در موبایل */
            box-sizing: border-box; /* برای اینکه padding باعث بیرون زدگی نشود */
            max-width: 400px; /* جلوگیری از خیلی پهن شدن متن در مانیتورهای بزرگ */
            width: 100%; /* استفاده از تمام عرض در دسترس (با رعایت padding) */
        }

        .info-item { 
            font-size: 15px; 
            color: #444; 
            margin-bottom: 8px; 
            font-weight: 400;
            word-wrap: break-word; /* شکستن کلمات طولانی اگر لازم بود */
        }

        /* استایل لینک تلفن */
        .phone-link {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 8px;
            direction: ltr;
            text-decoration: none;
            transition: transform 0.2s ease;
        }

        /* استایل لینک اینستاگرام */
        .instagram-link {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 8px;
            direction: ltr;
            text-decoration: none;
            transition: transform 0.2s ease;
        }

        .phone-link:hover, .instagram-link:hover {
            transform: scale(1.03);
        }

        .phone-svg, .instagram-icon {
            width: 20px;
            height: 20px;
            display: block;
        }

        .phone-svg {
            fill: #25D366; 
        }

        .phone-text, .instagram-text {
            font-size: 15px;
            color: #444;
            font-weight: 400;
        }

        .button-group {
            margin-top: 25px;
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap; /* برای اینکه اگر دکمه‌ها زیاد شد، در موبایل زیر هم قرار بگیرند */
        }

        .btn {
            padding: 8px 22px;
            border: 1.5px solid #333;
            background: transparent;
            cursor: pointer;
            font-family: 'Vazirmatn', sans-serif;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s ease;
            border-radius: 5px;
        }

        .btn:hover { 
            background: #333; 
            color: #fff; 
        }

        @keyframes introAnimation {
            0% { opacity: 0; transform: scale(0.2); }
            50% { opacity: 1; transform: scale(1.2); }
            100% { opacity: 1; transform: scale(1) translateY(-150px); }
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="main-container">
        <div class="logo-wrapper">
            <img src="logo-title-red.png" alt="لوگوی فروشگاه پوشاک تیوان">
        </div>

        <div class="info-container">
            <div class="info-item">آدرس فروشگاه: اصفهان - خیابان نظرغربی - سه راه نظر - جنب بانک ملی</div>
            
            <a href="tel:03136264237" class="phone-link">
                <svg class="phone-svg" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M6.62,10.79C8.06,13.62 10.38,15.94 13.21,17.38L15.41,15.18C15.69,14.9 16.08,14.82 16.43,14.93C17.55,15.3 18.75,15.5 20,15.5A1,1 0 0,1 21,16.5V20A1,1 0 0,1 20,21A17,17 0 0,1 3,4A1,1 0 0,1 4,3H7.5A1,1 0 0,1 8.5,4C8.5,5.25 8.7,6.45 9.07,7.57C9.18,7.92 9.1,8.31 8.82,8.59L6.62,10.79Z" />
                </svg>
                <div class="phone-text">03136264237</div>
            </a>

            <a href="https://instagram.com/tivan.shop" target="_blank" class="instagram-link">
                <img class="instagram-icon" src="https://upload.wikimedia.org/wikipedia/commons/a/a5/Instagram_icon.png" alt="Instagram">
                <div class="instagram-text">instagram.com/tivan.shop</div>
            </a>
            
            <div class="button-group">
                <button class="btn">فرم همکاری</button>
                <button class="btn">گالری عکس‌ها</button>
            </div>
        </div>
    </div>

</body>
</html>
