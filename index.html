<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فروشگاه تیوان</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: #ffffff;
            font-family: 'Vazirmatn', sans-serif;
            text-align: center;
        }

        .main-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .logo-wrapper {
            width: 120px;
            opacity: 0;
            animation: introAnimation 2s ease forwards;
        }

        .logo-wrapper img { width: 100%; }

        .info-container {
            margin-top: -40px;
            opacity: 0;
            animation: fadeIn 1s ease forwards 1.5s;
            padding: 0 20px;
            max-width: 500px;
        }

        /* بخش آدرس و تلفن که کنار هم قرار می‌گیرند */
        .address-phone-group {
            display: flex;
            flex-wrap: wrap; /* اگر فضا کم بود، خودکار می‌شکند */
            justify-content: center;
            align-items: center;
            gap: 6px;
            margin-bottom: 10px;
        }

        .info-item { font-size: 15px; color: #333; }

        .phone-link {
            display: flex;
            align-items: center;
            gap: 5px;
            text-decoration: none;
            color: #333;
            font-size: 15px;
            white-space: nowrap; /* تلفن در کنار آدرس بماند */
        }

        .phone-svg { width: 16px; height: 16px; fill: #25D366; }

        .instagram-link {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-decoration: none;
            color: #333;
            margin-bottom: 20px;
        }

        .instagram-icon { width: 18px; }

        .button-group {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        .btn {
            padding: 8px 20px;
            border: 1px solid #333;
            background: transparent;
            cursor: pointer;
            font-family: 'Vazirmatn', sans-serif;
            border-radius: 5px;
            transition: 0.3s;
        }

        .btn:hover { background: #333; color: #fff; }

        @keyframes introAnimation {
            0% { opacity: 0; transform: translateY(20px) scale(0.9); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        @keyframes fadeIn { to { opacity: 1; } }
    </style>
</head>
<body>

    <div class="main-container">
        <div class="logo-wrapper">
            <img src="logo-title-red.png" alt="لوگوی تیوان">
        </div>

        <div class="info-container">
            <!-- آدرس و تلفن در کنار هم -->
            <div class="address-phone-group">
                <span class="info-item">آدرس فروشگاه: اصفهان - خیابان نظرغربی - سه راه نظر - جنب بانک ملی</span>
                <a href="tel:03136264237" class="phone-link">
                    <svg class="phone-svg" viewBox="0 0 24 24"><path d="M6.62,10.79C8.06,13.62 10.38,15.94 13.21,17.38L15.41,15.18C15.69,14.9 16.08,14.82 16.43,14.93C17.55,15.3 18.75,15.5 20,15.5A1,1 0 0,1 21,16.5V20A1,1 0 0,1 20,21A17,17 0 0,1 3,4A1,1 0 0,1 4,3H7.5A1,1 0 0,1 8.5,4C8.5,5.25 8.7,6.45 9.07,7.57C9.18,7.92 9.1,8.31 8.82,8.59L6.62,10.79Z"/></svg>
                    03136264237
                </a>
            </div>

            <a href="https://instagram.com/tivan.shop" target="_blank" class="instagram-link">
                <img class="instagram-icon" src="https://upload.wikimedia.org/wikipedia/commons/a/a5/Instagram_icon.png" alt="Instagram">
                <span>instagram.com/tivan.shop</span>
            </a>
            
            <div class="button-group">
                <button class="btn">فرم همکاری</button>
                <button class="btn">گالری عکس‌ها</button>
            </div>
        </div>
    </div>

</body>
</html>
