<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فروشگاه تیوان</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background-color: #ffffff;
            font-family: 'Vazirmatn', sans-serif;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .main-container {
            width: 100%;
            max-width: 500px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .logo-spacer {
            height: 180px;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .logo-wrapper {
            width: 120px;
            opacity: 0;
            transform: scale(0);
            animation: logoIntro 2.5s cubic-bezier(0.65, 0, 0.35, 1) forwards;
            transform-origin: center center;
            will-change: transform, opacity;
        }

        .logo-wrapper img {
            width: 100%;
            height: auto;
            display: block;
        }

        .info-container {
            width: 100%;
            text-align: center;
            opacity: 0;
            transform: translateY(10px);
            animation: fadeIn 0.8s ease forwards 2.2s;
        }

        .info-item {
            font-size: 15px;
            color: #444;
            margin-bottom: 12px;
            line-height: 1.9;
            overflow-wrap: break-word;
        }

        .phone-link,
        .instagram-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-decoration: none;
            color: #444;
            margin: 5px 0;
            padding: 5px 10px;
            transition: transform 0.25s ease;
            direction: ltr;
            unicode-bidi: isolate;
        }

        .phone-link:hover,
        .instagram-link:hover {
            transform: scale(1.05);
        }

        .phone-svg {
            width: 20px;
            height: 20px;
            fill: #25D366;
            display: block;
            flex: 0 0 auto;
        }

        .instagram-icon {
            width: 20px;
            height: 20px;
            display: block;
            flex: 0 0 auto;
        }

        .phone-text,
        .instagram-text {
            font-size: 15px;
            color: #444;
            font-weight: 400;
            direction: ltr;
            unicode-bidi: isolate;
            white-space: nowrap;
        }

        .button-group {
            margin-top: 25px;
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 8px 22px;
            border: 1.5px solid #333;
            background: transparent;
            cursor: pointer;
            font-family: 'Vazirmatn', sans-serif;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s ease;
            border-radius: 5px;
        }

        .btn:hover {
            background: #333;
            color: #fff;
        }

        @keyframes logoIntro {
            0% {
                opacity: 0;
                transform: translateY(40px) scale(0);
            }
            45% {
                opacity: 1;
                transform: translateY(0) scale(1.18);
            }
            75% {
                opacity: 1;
                transform: translateY(-120px) scale(1.05);
            }
            100% {
                opacity: 1;
                transform: translateY(-150px) scale(1);
            }
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 480px) {
            .logo-wrapper {
                width: 104px;
            }

            @keyframes logoIntro {
                0% {
                    opacity: 0;
                    transform: translateY(30px) scale(0);
                }
                45% {
                    opacity: 1;
                    transform: translateY(0) scale(1.15);
                }
                75% {
                    opacity: 1;
                    transform: translateY(-95px) scale(1.03);
                }
                100% {
                    opacity: 1;
                    transform: translateY(-115px) scale(1);
                }
            }
        }
    </style>
</head>
<body>

    <div class="main-container">
        <div class="logo-spacer">
            <div class="logo-wrapper">
                <img src="logo-title-red.png" alt="لوگوی فروشگاه تیوان">
            </div>
        </div>

        <div class="info-container">
            <div class="info-item">
                آدرس فروشگاه: اصفهان - خیابان نظرغربی - سه راه نظر - جنب بانک ملی
            </div>

            <a href="tel:03136264237" class="phone-link">
                <svg class="phone-svg" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M6.62,10.79C8.06,13.62 10.38,15.94 13.21,17.38L15.41,15.18C15.69,14.9 16.08,14.82 16.43,14.93C17.55,15.3 18.75,15.5 20,15.5A1,1 0 0,1 21,16.5V20A1,1 0 0,1 20,21A17,17 0 0,1 3,4A1,1 0 0,1 4,3H7.5A1,1 0 0,1 8.5,4C8.5,5.25 8.7,6.45 9.07,7.57C9.18,7.92 9.1,8.31 8.82,8.59L6.62,10.79Z"/>
                </svg>
                <span class="phone-text">03136264237</span>
            </a>

            <a href="https://instagram.com/tivan.shop" target="_blank" class="instagram-link" rel="noopener noreferrer">
                <img class="instagram-icon" src="https://upload.wikimedia.org/wikipedia/commons/a/a5/Instagram_icon.png" alt="Instagram">
                <span class="instagram-text">instagram.com/tivan.shop</span>
            </a>

            <div class="button-group">
                <button class="btn">فرم همکاری</button>
                <button class="btn">گالری عکس‌ها</button>
            </div>
        </div>
    </div>

</body>
</html>
