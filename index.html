<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فروشگاه تیوان</title>

    <meta name="description" content="فروشگاه پوشاک تیوان - عرضه انواع پوشاک زنانه در اصفهان">

    <link rel="icon" type="image/png" href="logo-title-red.png">

    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100;400;500;700&display=swap" rel="stylesheet">

    <style>
        *{
            box-sizing:border-box;
        }

        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #ffffff;
            font-family: 'Vazirmatn', sans-serif;

            overflow-x: hidden;
            overflow-y: auto;
        }

        .main-container {
            width: 100%;
            max-width: 500px;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            text-align: center;
            padding: 20px;
        }

        .logo-wrapper {
            width: 120px;
            opacity: 0;
            animation: introAnimation 2.5s cubic-bezier(0.65,0,0.35,1) forwards;
        }

        .logo-wrapper img {
            width: 100%;
            height: auto;
            display: block;
        }

        .info-container {
            margin-top: -40px;

            opacity: 0;
            animation: fadeIn 1s ease forwards 2.5s;

            width: 100%;
            max-width: 400px;
            padding: 0 20px;

            line-height: 1.9;
        }

        .info-item {
            color: #444;
            margin-bottom: 10px;
            font-size: clamp(14px, 2vw, 15px);
            font-weight: 400;
            word-wrap: break-word;
        }

        .phone-link,
        .instagram-link {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;

            direction: ltr;

            text-decoration: none;
            margin-bottom: 10px;

            transition: transform .2s ease;
        }

        .phone-link:hover,
        .instagram-link:hover {
            transform: scale(1.03);
        }

        .phone-svg,
        .instagram-svg {
            width: 20px;
            height: 20px;
            flex-shrink: 0;
        }

        .phone-svg {
            fill: #25D366;
        }

        .instagram-svg {
            fill: #E1306C;
        }

        .phone-text,
        .instagram-text {
            color: #444;
            font-size: 15px;
            font-weight: 400;
        }

        .button-group {
            margin-top: 25px;

            display: flex;
            justify-content: center;
            gap: 12px;

            flex-wrap: wrap;
        }

        .btn {
            display: inline-block;

            padding: 8px 22px;

            border: 1.5px solid #333;
            border-radius: 5px;

            text-decoration: none;
            color: #333;
            background: transparent;

            font-family: 'Vazirmatn', sans-serif;
            font-size: 14px;
            font-weight: 500;

            transition: all .3s ease;
        }

        .btn:hover {
            background: #333;
            color: #fff;
        }

        @keyframes introAnimation {
            0% {
                opacity: 0;
                transform: scale(0.2);
            }

            50% {
                opacity: 1;
                transform: scale(1.2);
            }

            100% {
                opacity: 1;
                transform: scale(1) translateY(-100px);
            }
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
            }
        }

        @media (max-width:480px){

            .logo-wrapper{
                width:100px;
            }

            .info-container{
                margin-top:-30px;
            }

            .btn{
                width:100%;
                max-width:220px;
            }
        }
    </style>
</head>
<body>

<div class="main-container">

    <div class="logo-wrapper">
        <img src="logo-title-red.png" alt="لوگوی فروشگاه تیوان">
    </div>

    <div class="info-container">

        <div class="info-item">
            آدرس فروشگاه: اصفهان - خیابان نظرغربی - سه راه نظر - جنب بانک ملی
        </div>

        <a href="tel:03136264237" class="phone-link">

            <svg class="phone-svg" viewBox="0 0 24 24">
                <path d="M6.62,10.79C8.06,13.62 10.38,15.94 13.21,17.38L15.41,15.18C15.69,14.9 16.08,14.82 16.43,14.93C17.55,15.3 18.75,15.5 20,15.5A1,1 0 0,1 21,16.5V20A1,1 0 0,1 20,21A17,17 0 0,1 3,4A1,1 0 0,1 4,3H7.5A1,1 0 0,1 8.5,4C8.5,5.25 8.7,6.45 9.07,7.57C9.18,7.92 9.1,8.31 8.82,8.59L6.62,10.79Z"/>
            </svg>

            <span class="phone-text">03136264237</span>

        </a>

        <a href="https://instagram.com/tivan.shop"
           target="_blank"
           rel="noopener noreferrer"
           class="instagram-link">

            <svg class="instagram-svg" viewBox="0 0 24 24">
                <path d="M7,2C4.24,2 2,4.24 2,7V17C2,19.76 4.24,22 7,22H17C19.76,22 22,19.76 22,17V7C22,4.24 19.76,2 17,2H7M18,4A1,1 0 0,1 19,5A1,1 0 0,1 18,6A1,1 0 0,1 17,5A1,1 0 0,1 18,4M12,7A5,5 0 0,1 17,12A5,5 0 0,1 12,17A5,5 0 0,1 7,12A5,5 0 0,1 12,7M12,9A3,3 0 0,0 9,12A3,3 0 0,0 12,15A3,3 0 0,0 15,12A3,3 0 0,0 12,9Z"/>
            </svg>

            <span class="instagram-text">instagram.com/tivan.shop</span>

        </a>

        <div class="button-group">

            <a href="hamkari.html" class="btn">
                فرم همکاری
            </a>

            <a href="gallery.html" class="btn">
                گالری عکس‌ها
            </a>

        </div>

    </div>

</div>

</body>
</html>
