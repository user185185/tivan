<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="icon" type="image/png" href="logo-title-red.png">
    <title>فروشگاه پوشاک تیوان</title>
    
    <style>
        @font-face {
            font-family: 'BNazanin';
            src: url('BNazanin.ttf') format('truetype');
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start; 
            min-height: 100vh;
            background-color: #ffffff; 
            font-family: 'BNazanin', 'B Nazanin', 'Tahoma', sans-serif;
            overflow-x: hidden;
        }

        /* کانتینر اصلی هدر */
        .header-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 30px; /* فاصله از سقف صفحه */
            width: 100%;
            opacity: 0;
            animation: fadeInHeader 1s ease-out 2.5s forwards;
        }

        /* لوگو */
        .logo-wrapper {
            width: 100px; /* سایز پیش‌فرض برای موبایل */
            height: auto;
            opacity: 0;
            animation: logoIntro 2.5s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        /* سایز لوگو در کامپیوتر و تبلت */
        @media (min-width: 768px) {
            .logo-wrapper {
                width: 140px; 
            }
        }

        .logo-wrapper img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* متن زیر لوگو - چسبیده به لوگو */
        .store-title {
            font-size: 18px; /* سایز برای موبایل */
            color: #333;
            margin-top: 5px; /* فاصله بسیار کم برای چسبیدن به لوگو */
            font-weight: bold;
            opacity: 0;
            animation: titleAppear 1s ease-out 2.2s forwards;
        }

        /* سایز متن در کامپیوتر و تبلت */
        @media (min-width: 768px) {
            .store-title {
                font-size: 26px;
            }
        }

        /* --- انیمیشن‌ها --- */

        /* انیمیشن ورود لوگو (فقط بزرگ شدن، بدون جابه‌جایی خطرناک) */
        @keyframes logoIntro {
            0% {
                opacity: 0;
                transform: scale(0.3);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* انیمیشن ظاهر شدن متن */
        @keyframes titleAppear {
            0% {
                opacity: 0;
                transform: translateY(-5px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* انیمیشن ظاهر شدن کل هدر */
        @keyframes fadeInHeader {
            from { opacity: 0; }
            to { opacity: 1; }
        }

    </style>
</head>
<body>

    <div class="header-container">
        <div class="logo-wrapper">
            <img src="logo-title-red.png" alt="لوگوی فروشگاه پوشاک تیوان">
        </div>

        <div class="store-title">
            فروشگاه پوشاک تیوان
        </div>
    </div>

</body>
</html>
