<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="logo-title-red.png">
    <title>فروشگاه تیوان</title>
    
    <!-- فراخوانی فونت استاندارد فارسی از گوگل -->
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100;400;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: #ffffff;
            /* استفاده از فونت وزیر */
            font-family: 'Vazirmatn', sans-serif;
            overflow: hidden;
        }

        .main-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .logo-wrapper {
            width: 120px;
            height: auto;
            opacity: 0;
            animation: introAnimation 2.5s cubic-bezier(0.65, 0, 0.35, 1) forwards;
        }

        .logo-wrapper img {
            width: 100%;
            height: auto;
            display: block;
        }

        .info-container {
            margin-top: -80px; 
            opacity: 0;
            animation: fadeIn 1s ease forwards 2.5s; 
            line-height: 1.8; /* کمی کمتر برای ظاهر مدرن‌تر */
        }

        /* استایل اصلاح شده متن‌ها برای خوانایی بهتر */
        .info-item { 
            font-size: 15px; 
            color: #444; 
            margin-bottom: 8px; 
            font-weight: 400;
        }

        .button-group {
            margin-top: 25px;
            display: flex;
            gap: 12px;
            justify-content: center;
        }

        .btn {
            padding: 8px 22px;
            border: 1.5px solid #333;
            background: transparent;
            cursor: pointer;
            font-family: 'Vazirmatn', sans-serif; /* اعمال فونت روی دکمه‌ها */
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s ease;
            border-radius: 5px; /* کمی گرد کردن گوشه‌ها برای ظاهر مدرن */
        }

        .btn:hover { 
            background: #333; 
            color: #fff; 
        }

        @keyframes introAnimation {
            0% { opacity: 0; transform: scale(0.2); }
            50% { opacity: 1; transform: scale(1.2); }
            100% { opacity: 1; transform: scale(1) translateY(-150px); }
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="main-container">
        <div class="logo-wrapper">
            <img src="logo-title-red.png" alt="لوگوی فروشگاه پوشاک تیوان">
        </div>

        <div class="info-container">
            <div class="info-item">آدرس فروشگاه: اصفهان - خیابان نظر غربی - سه راه نظر - جنب بانک ملی</div>
            <div class="info-item">تلفن فروشگاه: 03136264237</div>
            <div class="info-item">اینستاگرام: instagram.com/tivan.shop</div>
            
            <div class="button-group">
                <button class="btn">فرم همکاری</button>
                <button class="btn">گالری عکس‌ها</button>
            </div>
        </div>
    </div>

</body>
</html>
